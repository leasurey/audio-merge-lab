<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="检测当前浏览器是否能完整运行录音合并器。纯 ES5 编写，兼容极旧内核。">
<title>兼容性自检 · 录音合并器</title>
<style>
/* 文档页共用样式 —— 使用指南 / 格式转换 / 兼容性自检
 *
 * 与主页同一套设计依据：
 *  - 明暗两套语义色（HIG · Color），不硬编码具体界面色
 *  - 8pt 间距网格、层级化圆角
 *  - 中文优先的系统字体栈，Apple 设备上命中苹方（PingFang SC）
 *
 * 这里只放文档页需要的组件，主页那套交互控件在 src/styles.css。
 */
:root {
  color-scheme: light;

  --r-card: 14px;
  --r-control: 10px;
  --r-pill: 999px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* 语义色 · Light */
  --bg: #f2f2f7;
  --card: #ffffff;
  --fill: rgba(120, 120, 128, 0.12);
  --separator: rgba(60, 60, 67, 0.12);
  --label: #000000;
  --label-2: rgba(60, 60, 67, 0.72);
  --label-3: rgba(60, 60, 67, 0.60);
  --tint: #007aff;
  --ok: #1a7f3c;
  --ok-bg: rgba(52, 199, 89, 0.12);
  --warn: #8a4300;
  --warn-bg: rgba(255, 149, 0, 0.14);
  --danger: #d70015;
  --danger-bg: rgba(255, 59, 48, 0.10);

  /* 中文优先：Apple 平台上 -apple-system 即苹方/SF，Windows 回落到雅黑 */
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, "Courier New", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --fill: rgba(118, 118, 128, 0.24);
    --separator: rgba(84, 84, 88, 0.60);
    --label: #ffffff;
    --label-2: rgba(235, 235, 245, 0.70);
    --label-3: rgba(235, 235, 245, 0.55);
    --tint: #0a84ff;
    --ok: #30d158;
    --ok-bg: rgba(48, 209, 88, 0.16);
    --warn: #ff9f0a;
    --warn-bg: rgba(255, 159, 10, 0.16);
    --danger: #ff453a;
    --danger-bg: rgba(255, 69, 58, 0.16);
  }
}

html, body {
  margin: 0;
  padding: 0;
  /* 先写字面值再写变量：不支持 var() 的极旧内核会丢掉第二条声明，
     退化成浏览器默认排版（内容仍完整可读），不会只剩白底黑字无间距。 */
  background: #f2f2f7;
  background: var(--bg);
  color: #000000;
  color: var(--label);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: calc(var(--sp-6) + env(safe-area-inset-top)) var(--sp-4)
    calc(var(--sp-8) + env(safe-area-inset-bottom));
}

/* ---------- 页头 ---------- */
h1 {
  margin: 0 0 var(--sp-1);
  font-size: 28px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.sub {
  margin: 0 0 var(--sp-3);
  color: var(--label-2);
  font-size: 15px;
}

.nav {
  margin: 0 0 var(--sp-5);
  font-size: 15px;
}

.nav a {
  color: var(--tint);
  text-decoration: none;
  margin-right: var(--sp-4);
}

.nav a:hover { text-decoration: underline; }

/* ---------- 分组卡片 ---------- */
.card {
  background: var(--card);
  border-radius: var(--r-card);
  padding: var(--sp-4);
  margin: 0 0 var(--sp-3);
}

.card h2 {
  margin: 0 0 var(--sp-3);
  font-size: 17px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.2px;
}

.card h2:first-child { margin-top: 0; }

.card h3 {
  margin: var(--sp-4) 0 var(--sp-2);
  font-size: 15px;
  font-weight: 600;
}

.card p {
  margin: 0 0 var(--sp-2);
  font-size: 15px;
  color: var(--label-2);
}

.card p:last-child { margin-bottom: 0; }

.card b, .card strong { color: var(--label); font-weight: 600; }

a { color: var(--tint); }

code, kbd {
  font-family: var(--mono);
  font-size: 0.92em;
  background: var(--fill);
  border-radius: 5px;
  padding: 1px 5px;
}

.hint {
  font-size: 13px;
  line-height: 1.6;
  color: var(--label-3);
  margin: var(--sp-2) 0 0;
}

/* ---------- 表格 ---------- */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin: var(--sp-2) 0 0;
  table-layout: auto;
}

th, td {
  text-align: left;
  padding: 10px var(--sp-2);
  border-bottom: 1px solid var(--separator);
  vertical-align: top;
  line-height: 1.5;
  word-break: break-word;
}

/* 首列一般是格式名（短），不换行以免把宽度让给错列；
   末列是"适合"这类短语，给一个下限避免被挤成竖排 */
th:first-child, td:first-child { white-space: nowrap; }
th:last-child, td:last-child { min-width: 88px; }

tr:last-child td { border-bottom: 0; }

th {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-3);
  padding-bottom: var(--sp-2);
}

td { color: var(--label-2); }
td b, td strong { color: var(--label); font-weight: 600; }

/* ---------- 步骤（使用指南） ---------- */
.step {
  display: flex;
  gap: var(--sp-3);
  margin: var(--sp-4) 0;
}

.step:first-of-type { margin-top: var(--sp-2); }
.step:last-of-type { margin-bottom: 0; }

.num {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: var(--r-pill);
  background: var(--fill);
  color: var(--label-2);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}

.step > div:last-child { min-width: 0; }

/* 只命中步骤标题那个 b；正文里的 <b> 是行内强调，不能变成独立块 */
.step > div:last-child > b:first-child {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--label);
}

.step p b, .step p strong { color: var(--label); font-weight: 600; }

.step p {
  margin: 3px 0 0;
  font-size: 15px;
  color: var(--label-2);
}

/* ---------- 标签 ---------- */
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  border-radius: 5px;
  padding: 1px 6px;
  margin-left: 4px;
  vertical-align: 1px;
  background: var(--fill);
  color: var(--label-2);
}

.tag.ok, .tag.best { background: var(--ok-bg); color: var(--ok); }
.tag.mid { background: var(--warn-bg); color: var(--warn); }
.tag.warn { background: var(--danger-bg); color: var(--danger); }

/* ---------- 提示框 ---------- */
.warn-box {
  background: var(--warn-bg);
  color: var(--warn);
  border-radius: var(--r-control);
  padding: var(--sp-3);
  font-size: 14px;
  line-height: 1.55;
  margin: var(--sp-3) 0 0;
}

/* ---------- 常见问题 ---------- */
.faq q {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--label);
  margin-top: var(--sp-4);
  quotes: none;
}

.faq q:first-child { margin-top: 0; }

.faq p {
  margin: 4px 0 0;
  font-size: 15px;
  color: var(--label-2);
}

/* ---------- 兼容性自检页 ---------- */
.verdict {
  background: var(--card);
  border-radius: var(--r-card);
  padding: var(--sp-4);
  margin: 0 0 var(--sp-3);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
}

.verdict.ok { color: var(--ok); }
.verdict.warn { color: var(--warn); }
.verdict.bad { color: var(--danger); }

.kv {
  font-size: 14px;
  line-height: 1.85;
  color: var(--label-2);
  word-break: break-word;
}

.kv b { color: var(--label); font-weight: 600; }

.probes {
  display: grid;
  gap: 1px;
  background: var(--separator);
  border-radius: var(--r-control);
  overflow: hidden;
  margin-top: var(--sp-3);
}

.probes > * {
  background: var(--card);
  padding: 10px var(--sp-3);
  font-size: 14px;
  line-height: 1.5;
}

.probes li {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
}

.probes .tag {
  flex: 0 0 auto;
  margin: 2px 0 0;
  min-width: 42px;
  text-align: center;
}

.probes .tag.pass { background: var(--ok-bg); color: var(--ok); }
.probes .tag.fail { background: var(--danger-bg); color: var(--danger); }
.probes .tag.na { background: var(--warn-bg); color: var(--warn); }

.p-label {
  min-width: 0;
  font-size: 15px;
  line-height: 1.45;
  color: var(--label);
}

.p-note {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--label-3);
}

pre, .report {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  background: var(--fill);
  color: var(--label-2);
  border-radius: var(--r-control);
  padding: var(--sp-3);
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
  margin: var(--sp-3) 0 0;
}

/* ---------- 按钮 ---------- */
button, .btn {
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: var(--tint);
  background: var(--fill);
  border: 0;
  border-radius: var(--r-control);
  padding: 10px var(--sp-4);
  min-height: 44px;
  cursor: pointer;
  -webkit-appearance: none;
}

button:active { opacity: 0.6; }

input[type="file"] {
  font-family: inherit;
  font-size: 13px;
  color: var(--label-2);
}

/* ---------- 返回 ---------- */
.back {
  text-align: center;
  margin: var(--sp-6) 0 var(--sp-3);
  font-size: 15px;
}

.back a { color: var(--tint); text-decoration: none; }

.copy { margin: var(--sp-3) 0 0; }

@media (max-width: 520px) {
  table { font-size: 13px; }
  th, td { padding: 9px 6px; }
  th:last-child, td:last-child { min-width: 64px; }
}

@media (max-width: 380px) {
  h1 { font-size: 24px; }
  .card { padding: var(--sp-3); }
}

</style>
</head>
<body>
<div class="wrap">
  <h1>兼容性自检</h1>
  <p class="sub">本页用纯 ES5 编写，能被很旧的浏览器内核解析。它检测当前浏览器能否完整运行「录音合并器」，并把结果整理成可复制的报告。</p>

  <div class="verdict" id="verdict">检测中…</div>
  <p class="hint" style="margin:-4px 0 12px"><a href="guide.html">使用指南</a> · <a href="convert.html">格式转换</a> · <a href="./">返回应用</a></p>

  <section class="card">
    <h2>浏览器信息</h2>
    <div class="kv" id="env">读取中…</div>
  </section>

  <section class="card">
    <h2>能力检测</h2>
    <ul class="probes" id="probes"></ul>
  </section>

  <section class="card">
    <h2>文件诊断（可选）</h2>
    <p class="hint">选一个导入失败的文件：本页会显示它的大小、真实格式（魔数嗅探），并测试本机能否解码。文件只在本地读取，不会上传。</p>
    <input type="file" id="diagFile" style="width:100%;margin-top:8px;">
    <div class="kv" id="diagOut" style="margin-top:10px;"></div>
  </section>

  <section class="card">
    <h2>复制诊断信息</h2>
    <p class="hint">遇到问题时把下面内容复制回传即可（不含任何个人数据）。</p>
    <textarea id="report" readonly rows="9"></textarea>
    <button id="btnCopy" type="button">复制诊断信息</button>
    <p class="hint" id="copyMsg"></p>
  </section>

  <p class="back"><a href="./">← 返回应用</a> · <a href="https://github.com/leasurey/audio-merge-lab" target="_blank" rel="noopener noreferrer">GitHub 项目</a></p>
</div>

<script>
/* 兼容性自检 — ES5 专用：不使用箭头函数 / let / const / 模板字符串 / class，
   确保旧内核（X5 Chromium 53、老 WebView）也能执行到这里。 */
(function () {
  'use strict';

  /* ---------------- 环境识别 ---------------- */
  var ua = navigator.userAgent;

  function pick(re) {
    var m = ua.match(re);
    return m ? m[1] : '';
  }

  var browser = { name: '未知', version: '' };
  var rules = [
    [/MicroMessenger\/([\d.]+)/i, '微信内置浏览器'],
    [/AlipayClient\/([\d.]+)/i, '支付宝内置浏览器'],
    [/Quark\/([\d.]+)/i, '夸克浏览器'],
    [/UCBrowser\/([\d.]+)/i, 'UC 浏览器'],
    [/MQQBrowser\/([\d.]+)/i, 'QQ 浏览器'],
    [/baiduboxapp\/?([\d.]*)/i, '百度 App'],
    [/BIDUBrowser\/([\d.]+)/i, '百度浏览器'],
    [/HuaweiBrowser\/([\d.]+)/i, '华为浏览器'],
    [/HonorBrowser\/([\d.]+)/i, '荣耀浏览器'],
    [/vivoBrowser\/([\d.]+)/i, 'vivo 浏览器'],
    [/MiuiBrowser\/([\d.]+)/i, '小米浏览器'],
    [/HeyTapBrowser\/([\d.]+)/i, 'OPPO 浏览器'],
    [/QihooBrowser|360SE|360EE/i, '360 浏览器'],
    [/SamsungBrowser\/([\d.]+)/i, '三星浏览器'],
    [/EdgA?\/([\d.]+)/i, 'Edge'],
    [/Firefox\/([\d.]+)/i, 'Firefox'],
    [/CriOS\/([\d.]+)/i, 'Chrome（iOS）'],
    [/Chrome\/([\d.]+)/i, 'Chrome'],
    [/Version\/([\d.]+).*Safari/i, 'Safari'],
    [/AppleWebKit/i, 'WebKit 内核']
  ];
  for (var i = 0; i < rules.length; i++) {
    var m = ua.match(rules[i][0]);
    if (m) { browser.name = rules[i][1]; browser.version = m[1] || ''; break; }
  }

  var chromium = pick(/Chrome\/([\d.]+)/i) || pick(/CriOS\/([\d.]+)/i);
  var androidVer = pick(/Android\s([\d.]+)/i);
  var iosVer = (ua.match(/OS (\d+)[._](\d+)/) || []).slice(1).join('.');
  var osName = /Android/i.test(ua) ? ('Android ' + androidVer) :
    (/iPhone|iPad|iPod/i.test(ua) ? ('iOS ' + iosVer) :
      (/Windows/i.test(ua) ? 'Windows' : (/Mac OS X/i.test(ua) ? 'macOS' : '其他')));

  /* ---------------- 能力探测 ---------------- */
  function hasAudioContext() {
    return typeof (window.AudioContext || window.webkitAudioContext) === 'function';
  }
  function hasDecode() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      return typeof AC.prototype.decodeAudioData === 'function';
    } catch (e) { return false; }
  }

  /* CSP（script-src 未含 unsafe-eval）会禁止 new Function。旧实现把由此抛出的
   * EvalError 当成「内核不支持 async」，给出「不兼容」的错误结论。
   * 现在用 null 表示「受 CSP 限制无法判定」，单独显示为「受限」，不判致命。 */
  function evalAllowed() {
    try { return new Function('return 1')() === 1; } catch (e) { return false; }
  }

  var probes = [
    { label: 'ES5 基础（本页能显示即为通过）', fn: function () { return true; } },
    { label: 'Promise', fn: function () { return typeof Promise === 'function'; } },
    { label: 'async / await 语法（ES2017）',
      note: '低于此线：应用无法解析，会显示启动失败提示',
      fn: function () {
        if (!evalAllowed()) return null;
        try { return !!new Function('return (async function(){})'); } catch (e) { return false; }
      } },
    { label: 'for await 语法（ES2018）',
      note: '应用已不使用该语法，仅作参考',
      fn: function () {
        if (!evalAllowed()) return null;
        try { return !!new Function('return (async function(){ for await (var x of []) {} })'); } catch (e) { return false; }
      } },
    { label: '动态代码执行（eval / new Function）',
      note: '仅 MP3 内置兜底解码需要；被 CSP 禁用时该降级路径不可用，主功能不受影响',
      fn: evalAllowed },
    { label: 'Web Audio（AudioContext）',
      note: '解码与合并的基础，缺失则完全不可用',
      fn: hasAudioContext },
    { label: '音频解码（decodeAudioData）',
      note: '导入 mp3 / m4a / wav 必需',
      fn: hasDecode },
    { label: '录音（MediaRecorder）', note: '缺失则「开始录音」不可用', fn: function () {
      return typeof window.MediaRecorder === 'function';
    } },
    { label: 'M4A 录制（audio/mp4）', note: 'M4A 输出选项依赖此能力', fn: function () {
      try { return typeof window.MediaRecorder === 'function' && MediaRecorder.isTypeSupported('audio/mp4'); }
      catch (e) { return false; }
    } },
    { label: '麦克风接口（getUserMedia）', fn: function () {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    } },
    { label: 'Blob / ObjectURL（导出用）', fn: function () {
      return typeof window.Blob === 'function' && typeof URL !== 'undefined' &&
        typeof URL.createObjectURL === 'function';
    } },
    { label: 'FileReader（兜底读文件）', fn: function () { return typeof FileReader === 'function'; } },
    { label: '多文件选择（multiple）', fn: function () {
      try { return 'multiple' in document.createElement('input'); } catch (e) { return false; }
    } },
    { label: '文件选择器（input type=file）', fn: function () {
      try { var el = document.createElement('input'); el.type = 'file'; return el.type === 'file'; }
      catch (e) { return false; }
    } },
    { label: 'OPFS 流式落盘（长音频优化）',
      note: '缺失时合并走内存拼接，超长音频会有提示',
      fn: function () { return typeof navigator.storage !== 'undefined' && typeof navigator.storage.getDirectory === 'function'; } },
    { label: 'Service Worker（PWA 离线）', fn: function () { return 'serviceWorker' in navigator; } }
  ];

  var results = [];
  var passCount = 0;
  var failCount = 0;
  var unknownCount = 0;
  var ul = document.getElementById('probes');

  function runProbe(p) {
    var ok = false;
    try {
      var v = p.fn();
      ok = v === null ? null : !!v; // null = 受 CSP 限制，无法判定
    } catch (e) { ok = false; }
    results.push({ label: p.label, ok: ok, note: p.note || '' });
    if (ok === null) unknownCount++;
    else if (ok) passCount++;
    else failCount++;

    var li = document.createElement('li');
    var tag = document.createElement('span');
    tag.className = 'tag ' + (ok === null ? 'na' : (ok ? 'pass' : 'fail'));
    tag.textContent = ok === null ? '受限' : (ok ? '支持' : '缺失');
    li.appendChild(tag);
    var body = document.createElement('div');
    body.className = 'p-label';
    body.appendChild(document.createTextNode(p.label));
    if (p.note) {
      var n = document.createElement('span');
      n.className = 'p-note';
      n.textContent = p.note;
      body.appendChild(n);
    }
    li.appendChild(body);
    ul.appendChild(li);
  }
  for (var k = 0; k < probes.length; k++) runProbe(probes[k]);

  function resultOf(prefix) {
    for (var j = 0; j < results.length; j++) {
      if (results[j].label.indexOf(prefix) === 0) {
        // 「受限」不是「不支持」：不能据此判定浏览器内核过旧
        return results[j].ok !== false;
      }
    }
    return false;
  }

  /* ---------------- 判定 ---------------- */
  var verdict = document.getElementById('verdict');
  var level, text, detail;
  if (!resultOf('async')) {
    level = 'bad';
    text = '不兼容：浏览器内核过旧';
    detail = '当前内核不支持 async/await 语法（需 Chromium 55+ / iOS 11+ 或同等内核）。应用脚本无法解析，表现为白屏或"应用没能正常启动"。请升级浏览器（Chrome / Edge / 夸克 / 华为 / vivo 最新版），或在系统设置里更新 Android System WebView。';
  } else if (!resultOf('Web Audio') || !resultOf('音频解码')) {
    level = 'bad';
    text = '不可用：缺少 Web Audio 音频能力';
    detail = '当前浏览器没有 AudioContext 或 decodeAudioData，无法解码与合并音频。请更换为 Chrome / Edge / 系统 WebView 较新的浏览器。';
  } else if (!resultOf('Blob')) {
    level = 'bad';
    text = '不可用：缺少 Blob / ObjectURL';
    detail = '导出结果依赖 Blob 与 ObjectURL，请更换较新的浏览器。';
  } else {
    var missing = [];
    if (!resultOf('OPFS')) missing.push('OPFS 落盘');
    if (!resultOf('录音')) missing.push('录音');
    if (!resultOf('M4A')) missing.push('M4A 输出');
    if (missing.length === 0) {
      level = 'ok';
      text = '完整支持';
      detail = '导入、录音、WAV / MP3 / M4A 三种输出、长音频流式合并（OPFS 落盘）均可用。';
    } else {
      level = 'warn';
      text = '可用，但部分功能受限';
      detail = '缺失：' + missing.join('、') + '。合并不受影响；长音频（40 分钟以上）在无 OPFS 时会走内存拼接，应用会先弹窗提示。';
    }
  }
  if (unknownCount > 0) {
    detail += ' 另有 ' + unknownCount + ' 项因站点 CSP 禁止动态代码执行而无法探测（显示「受限」），请以主页面能否正常打开为准。';
  }
  verdict.className = 'verdict ' + level;
  verdict.innerHTML = '';
  verdict.appendChild(document.createTextNode(text));
  var d = document.createElement('span');
  d.className = 'detail';
  d.textContent = detail;
  verdict.appendChild(d);

  /* ---------------- 环境信息与报告 ---------------- */
  var env = document.getElementById('env');
  var envLines = [
    '识别结果：' + browser.name + (browser.version ? ' ' + browser.version : ''),
    '系统：' + osName + (/HarmonyOS/i.test(ua) ? '（HarmonyOS）' : ''),
    'Chromium 内核版本：' + (chromium || '无法识别'),
    'UA：' + ua
  ];
  env.innerHTML = '';
  for (var e = 0; e < envLines.length; e++) {
    var line = document.createElement('div');
    line.textContent = envLines[e];
    env.appendChild(line);
  }

  function buildReport() {
    var lines = [];
    lines.push('录音合并器 · 兼容性自检报告');
    lines.push('时间：' + new Date().toString());
    lines.push('判定：' + text);
    lines.push('识别：' + browser.name + (browser.version ? ' ' + browser.version : ''));
    lines.push('系统：' + osName + (chromium ? ' / Chromium ' + chromium : ''));
    lines.push('UA：' + ua);
    lines.push('---- 能力明细 ----');
    for (var j = 0; j < results.length; j++) {
      lines.push((results[j].ok ? '[支持] ' : '[缺失] ') + results[j].label);
    }
    return lines.join('\n');
  }

  var report = document.getElementById('report');
  report.value = buildReport();

  var copyMsg = document.getElementById('copyMsg');
  document.getElementById('btnCopy').onclick = function () {
    function fallback() {
      try {
        report.focus();
        report.select();
        var ok = document.execCommand && document.execCommand('copy');
        copyMsg.textContent = ok ? '已复制，可直接粘贴回传。' : '已选中文本，请长按/手动复制。';
      } catch (err) {
        copyMsg.textContent = '复制失败：请手动长按选择上方文本复制。';
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(report.value).then(function () {
        copyMsg.textContent = '已复制，可直接粘贴回传。';
      }, fallback);
    } else {
      fallback();
    }
  };

  /* ---------------- 文件诊断（ES5） ---------------- */
  var diagFile = document.getElementById('diagFile');
  var diagOut = document.getElementById('diagOut');
  var diagLines = [];

  function diagLine(label, value, color) {
    var d = document.createElement('div');
    d.style.margin = '3px 0';
    var b = document.createElement('b');
    b.textContent = label + '：';
    d.appendChild(b);
    var s = document.createElement('span');
    s.textContent = value;
    if (color) s.style.color = color;
    d.appendChild(s);
    diagOut.appendChild(d);
    diagLines.push(label + '：' + value);
    report.value = buildReport() + '\n---- 文件诊断 ----\n' + diagLines.join('\n');
  }

  /** 与 audio-core.js 的 sniffFormat 同源的 ES5 精简版（自检页独立可用） */
  function diagSniff(bytes) {
    function ascii(off, len) {
      var s = '';
      for (var i = 0; i < len && off + i < bytes.length; i++) s += String.fromCharCode(bytes[off + i]);
      return s;
    }
    if (!bytes || bytes.length === 0) return '空文件（0 字节）';
    if (bytes.length >= 12 && ascii(0, 4) === 'RIFF' && ascii(8, 4) === 'WAVE') return 'WAV（PCM 音频）';
    if (bytes.length >= 3 && ascii(0, 3) === 'ID3') return 'MP3（MPEG Layer III，含 ID3 标签）';
    // ADTS：同步字 0xFFF + 层位 00（含 F0/F1/F8/F9 变体），须先于 MPEG 判断
    if (bytes.length >= 2 && bytes[0] === 0xFF && (bytes[1] & 0xF6) === 0xF0) return 'AAC 裸流（ADTS）';
    if (bytes.length >= 2 && bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0 && ((bytes[1] >> 1) & 3) !== 0) {
      // MPEG layer 位：1=Layer III，2=Layer II，3=Layer I
      var layers = ['', 'III', 'II', 'I'];
      return 'MPEG 音频（Layer ' + layers[(bytes[1] >> 1) & 3] + '）';
    }
    if (bytes.length >= 8 && ascii(4, 4) === 'ftyp') return 'M4A/MP4（AAC 容器）';
    if (bytes.length >= 4 && ascii(0, 4) === 'OggS') return 'OGG（Opus / Vorbis）';
    if (bytes.length >= 4 && ascii(0, 4) === 'fLaC') return 'FLAC（无损）';
    if (bytes.length >= 5 && ascii(0, 5) === '#!AMR') return 'AMR（通话录音常见格式）';
    if (bytes.length >= 4 && bytes[0] === 0x1A && bytes[1] === 0x45 && bytes[2] === 0xDF && bytes[3] === 0xA3) return 'WebM';
    if (bytes.length >= 16 && bytes[0] === 0x30 && bytes[1] === 0x26 && bytes[2] === 0xB2 && bytes[3] === 0x75) return 'WMA（ASF 容器）';
    // SILK：真实文件常为 \x02#!SILK_V3，起始偏移不固定，故在头部 16 字节内搜索
    if (ascii(0, 16).indexOf('SILK') !== -1) return 'SILK（微信语音）';
    return '未知格式';
  }

  diagFile.onchange = function () {
    var f = diagFile.files && diagFile.files[0];
    diagOut.innerHTML = '';
    diagLines = [];
    if (!f) return;
    diagLine('文件名', f.name || '(无)');
    diagLine('大小', f.size + ' B（' + (f.size / 1024 / 1024).toFixed(2) + ' MB）');
    diagLine('MIME', f.type || '(浏览器未提供)');
    var reader = new FileReader();
    reader.onload = function () {
      var buf = reader.result;
      var bytes = new Uint8Array(buf);
      var hex = [];
      for (var i = 0; i < Math.min(16, bytes.length); i++) {
        hex.push((bytes[i] < 16 ? '0' : '') + bytes[i].toString(16));
      }
      diagLine('前 16 字节', hex.join(' '));
      diagLine('嗅探格式', diagSniff(bytes));

      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { diagLine('平台解码', '缺少 AudioContext，无法测试', '#ff9d94'); return; }
      var ctx;
      try { ctx = new AC(); } catch (e) {
        diagLine('平台解码', 'AudioContext 创建失败：' + e.message, '#ff9d94');
        return;
      }
      try {
        var ret = ctx.decodeAudioData(buf, function (ab) {
          diagLine('平台解码', '成功（' + ab.duration.toFixed(2) + 's / ' + ab.sampleRate +
            'Hz / ' + ab.numberOfChannels + ' 声道）', 'var(--ok)');
          diagLine('结论', '本机可解码；若应用内仍失败，请把本报告回传', 'var(--ok)');
        }, function (err) {
          diagLine('平台解码', '失败：' + ((err && err.message) || 'EncodingError'), '#ff9d94');
          diagLine('结论', '本机解码器不支持该文件——应用会用内置解码器重试（WAV / MP3）；其他格式需先转换', 'var(--warn)');
          var more = document.createElement('div');
          more.style.margin = '8px 0';
          var link = document.createElement('a');
          link.href = 'convert.html';
          link.textContent = '→ 查看格式转换方法';
          link.style.color = 'var(--tint)';
          more.appendChild(link);
          diagOut.appendChild(more);
        });
        if (ret && ret.then) {
          ret.catch(function (e) {
            diagLine('平台解码', '失败：' + ((e && e.message) || e), '#ff9d94');
          });
        }
      } catch (e2) {
        diagLine('平台解码', '异常：' + e2.message, '#ff9d94');
      }
    };
    reader.onerror = function () { diagLine('读取', '失败：无法读取文件', '#ff9d94'); };
    reader.readAsArrayBuffer(f);
  };
})();
</script>
</body>
</html>
