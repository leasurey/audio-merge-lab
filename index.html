<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="纯本地音频合并工具：导入或录音频，合并为 WAV / MP3 / M4A。iOS / Android / Web 通用。">
<title>录音合并器 · Audio Merge Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/**
 * boot-guard.js — 启动守卫（ES5 专用，切勿使用箭头函数/let/const/模板字符串）
 *
 * 存在的意义：主应用（app.js）使用 async/await（ES2017），在 Chromium < 55
 * 的旧内核里会整块解析失败——连 app.js 里的错误处理都不会执行，用户只看到
 * 白屏。本文件必须用纯 ES5 语法，确保任何能渲染 HTML 的内核都能执行，
 * 从而在"解析失败/初始化异常/超时未就绪"三种情况下给出可读提示与自检入口。
 */
(function () {
  'use strict';

  var booted = false;
  var shown = false;

  /** 主应用初始化成功后调用（同时撤掉可能已显示的提示） */
  window.__AML_BOOTED = function () {
    booted = true;
    try {
      var box = document.getElementById('amlBootError');
      if (box && box.parentNode) box.parentNode.removeChild(box);
    } catch (e) { /* 忽略 */ }
  };

  /** 主应用初始化异常时主动调用 */
  window.__AML_FAIL = function (msg) { show(msg); };

  function buildBanner(msg) {
    var box = document.createElement('div');
    box.id = 'amlBootError';
    box.setAttribute('style',
      'position:relative;z-index:99999;background:#2b1d1d;color:#ffd9d4;' +
      'border-bottom:1px solid #7a3a35;padding:12px 14px;' +
      'font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;');

    var p1 = document.createElement('div');
    var b = document.createElement('b');
    b.textContent = '应用没能正常启动';
    p1.appendChild(b);
    p1.appendChild(document.createTextNode('（' + msg + '）。可能是浏览器内核版本过旧。'));
    box.appendChild(p1);

    var p2 = document.createElement('div');
    p2.setAttribute('style', 'margin-top:8px;font-size:13px;');

    var a = document.createElement('a');
    a.href = 'compat.html';
    a.setAttribute('style', 'color:#8ab4ff;margin-right:16px;text-decoration:underline;');
    a.textContent = '① 运行兼容性自检';
    p2.appendChild(a);

    var btn = document.createElement('a');
    btn.href = '#';
    btn.setAttribute('style',
      'color:#8ab4ff;margin-right:16px;text-decoration:underline;cursor:pointer;');
    btn.textContent = '② 重试加载';
    btn.onclick = function (e) {
      if (e && e.preventDefault) e.preventDefault();
      location.reload();
      return false;
    };
    p2.appendChild(btn);

    var tip = document.createElement('span');
    tip.setAttribute('style', 'color:#c9a7a2;font-size:12px;');
    tip.textContent = '仍不行：请用 Chrome / Edge / 夸克等较新浏览器打开';
    p2.appendChild(tip);

    box.appendChild(p2);
    return box;
  }

  function show(msg) {
    if (shown) return;
    shown = true;

    function append() {
      try {
        if (!document.body) { setTimeout(append, 100); return; }
        var old = document.getElementById('amlBootError');
        if (old && old.parentNode) old.parentNode.removeChild(old);
        document.body.insertBefore(buildBanner(msg), document.body.firstChild);
      } catch (e) { /* 尽最大努力，失败就放弃 */ }
    }
    append();
  }

  // 1) 运行时异常（含后续 script 块的解析错误）
  window.onerror = function (message) {
    if (booted) return false; // 启动成功后不再弹此横幅，避免把偶发错误误报成"启动失败"
    show(String(message || '脚本执行出错').slice(0, 120));
    return false; // 不吞掉错误，控制台仍可见
  };

  // 2) 超时未就绪：DOM 可用后检查，主应用应在此之前替换为「就绪」状态
  function check() {
    if (booted || shown) return;
    var s = document.getElementById('status');
    if (s && s.textContent && s.textContent.indexOf('就绪') !== -1) { booted = true; return; }
    show('初始化超时或语法不被当前内核支持');
  }

  function schedule() {
    setTimeout(check, 5000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', schedule);
  } else {
    schedule();
  }
})();

</script>
<style>
/* 录音合并器 — 深色主题，移动端优先 */
:root {
  --bg: #0f1115;
  --card: #171b22;
  --card-2: #1d222b;
  --border: #2a313c;
  --text: #e8ebf0;
  --text-dim: #9aa4b2;
  --accent: #4f8cff;
  --accent-press: #3a6fd8;
  --danger: #e5534b;
  --ok: #3fb27f;
  --rec: #e5534b;
}

* { box-sizing: border-box; }

button, .btn { user-select: none; -webkit-user-select: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px calc(88px + env(safe-area-inset-bottom));
}

/* ---------- 头部 ---------- */
header.app-header {
  padding: calc(10px + env(safe-area-inset-top)) 2px 18px;
}
header.app-header h1 {
  margin: 0;
  font-size: 21px;
  letter-spacing: 0.5px;
}
header.app-header h1 .dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: 1px;
}
header.app-header p {
  margin: 6px 0 0;
  color: var(--text-dim);
  font-size: 13px;
}
header.app-header .header-links { margin-top: 8px; }
header.app-header .header-links a {
  color: var(--accent);
  font-size: 13px;
  text-decoration: none;
}
header.app-header .header-links a:hover { text-decoration: underline; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 14px;
}
.card h2 {
  margin: 0 0 10px;
  font-size: 15px;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card h2 .count {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: normal;
}
.hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--text-dim);
}

/* ---------- 按钮 ---------- */
/* display:inline-flex 显式声明：<label>（导入按钮）默认是 inline，
   不声明的话在非 flex 容器里会塌缩；flex 容器中子元素会被 blockify，
   两种宿主下都与 <button> 渲染一致 */
.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.05s ease, background 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-press); }
.btn.ghost {
  background: var(--card-2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn.ghost:hover { border-color: var(--accent); }
.btn:disabled, .btn.disabled {
  opacity: 0.45;
  pointer-events: none;
}
.btn.recording {
  background: var(--rec);
  color: #fff;
}
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger:hover { background: #c9463f; }
.btn.tiny { padding: 6px 12px; font-size: 13px; }

.btn-row {
  display: flex;
  gap: 10px;
}
.btn-row .btn { flex: 1; }

/* file input 视觉隐藏：保留布局盒子（非 display:none），
   iOS WKWebView 才认这个 input——label[for] 点击时原生激活它 */
.file-input-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* 兼容模式导入入口：部分国产内核的 accept 过滤有 bug，用不过滤的备用入口 */
.alt-import {
  display: block;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-dim);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.alt-import:active { color: var(--accent); }

/* ---------- 录音指示 ---------- */
.rec-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-dim);
  min-height: 20px;
}
.rec-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--rec);
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

/* ---------- 片段列表 ---------- */
ul.seg-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
ul.seg-list li.empty {
  color: var(--text-dim);
  font-size: 13px;
  padding: 14px 4px;
  text-align: center;
}
li.seg {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
}
li.seg:last-child { border-bottom: none; }
.seg-idx {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--card-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.seg-info { flex: 1; min-width: 0; }
.seg-name {
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.seg-meta {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
}
/* 兜底解码结果存疑时的警示行（例如平台只解出几十毫秒噪声） */
.seg-warn {
  font-size: 12px;
  line-height: 1.45;
  color: #f0d08a;
  margin-top: 3px;
}
.seg-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card-2);
  color: var(--text-dim);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.icon-btn.danger:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }

/* ---------- 选项 ---------- */
.opt-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}
.opt-row label { flex: 1; font-size: 14px; }
.opt-row output {
  font-size: 13px;
  color: var(--accent);
  min-width: 48px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
input[type="range"] {
  flex: 1.4;
  accent-color: var(--accent);
  height: 28px;
}
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  cursor: pointer;
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

/* ---------- 状态与结果 ---------- */
#status {
  font-size: 13px;
  color: var(--text-dim);
  padding: 10px 2px 14px;
  min-height: 20px;
  word-break: break-all;
}
#status.error { color: var(--danger); }

#resultBox audio {
  width: 100%;
  margin: 4px 0 10px;
}
#resultMeta {
  font-size: 13px;
  color: var(--text-dim);
  margin: 0 0 12px;
}

footer {
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  padding: 8px 0 24px;
}
footer .footer-line { display: block; }
footer .footer-author { margin-top: 2px; }
footer a {
  color: var(--accent);
  text-decoration: none;
}
footer a:hover { text-decoration: underline; }

/* ---------- 输出格式选择 ---------- */
.seg-control {
  display: flex;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 3px;
}
.seg-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--accent); color: #fff; }

select {
  appearance: none;
  -webkit-appearance: none;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 10px;
  cursor: pointer;
}
select:hover { border-color: var(--accent); }
/* iOS Safari/WKWebView 聚焦字号 <16px 的下拉框会自动放大页面，
   触屏设备上放大到 16px 防止缩放跳动（桌面指针设备不受影响） */
@media (pointer: coarse) {
  select { font-size: 16px; }
}

/* ---------- 进度条 ---------- */
#progressWrap { padding: 0 2px 12px; }
.progress-track {
  height: 8px;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.2s ease;
}
.progress-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-dim);
}

/* ---------- 片段试听 ---------- */
.icon-btn.play:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
li.seg.playing { background: var(--card-2); border-radius: 10px; }
li.seg.playing .seg-name { color: var(--accent); }

/* ---------- 片段状态（解码中 / 失败） ---------- */
li.seg.decoding .seg-name { color: var(--text-dim); }
li.seg.decoding .seg-meta { color: var(--accent); }
li.seg.failed .seg-name { color: var(--danger); }
li.seg.failed .seg-meta { color: var(--danger); }

/* ---------- 底部操作栏 ---------- */
.action-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: rgba(15, 17, 21, 0.92);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.action-inner {
  max-width: 692px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.action-summary {
  font-size: 13px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.action-bar .btn { flex: 0 0 auto; min-width: 108px; }

@media (min-width: 560px) {
  .btn-row .btn { flex: 0 0 auto; min-width: 160px; }
}

</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <h1><span class="dot"></span>录音合并器</h1>
    <p>导入 mp3 / m4a / wav / webm 等音频，或直接录音，按顺序合并为一个文件。全部在本地处理，不上传任何数据。</p>
    <p class="header-links"><a href="guide.html">第一次用？看使用指南 →</a></p>
  </header>

  <!-- 导入 / 录音 -->
  <section class="card">
    <h2>1. 添加片段</h2>
    <div class="btn-row">
      <!-- label[for] 原生激活 file input：iOS WKWebView（Chrome/Edge/Firefox on iOS 均强制使用）
           不响应 JS 对 display:none 的 input 的程序化 click()，必须走 label 关联 + 视觉隐藏 -->
      <label class="btn primary" id="btnImport" for="fileInput">导入音频文件</label>
      <button class="btn ghost" id="btnRecord" type="button">开始录音</button>
    </div>
    <input type="file" id="fileInput" class="file-input-hidden" accept="audio/*,.mp3,.m4a,.aac,.wav,.webm,.ogg,.flac" multiple>
    <!-- 兼容模式：部分国产内核（X5/夸克/UC/厂商自带）对 accept 过滤有已知 bug，
         会显示"没有音频文件"或直接不弹窗；此入口不过滤格式，选中后照常解码校验 -->
    <input type="file" id="fileInputAny" class="file-input-hidden" multiple>
    <label class="alt-import" for="fileInputAny" id="btnImportAny">选不到文件？用兼容模式选择（不过滤格式）</label>
    <div class="rec-indicator">
      <span class="rec-dot" id="recordDot" hidden></span>
      <span id="recordTime"></span>
    </div>
    <p class="hint">支持多选。文件仅在浏览器内解码，不会发送到任何服务器。</p>
  </section>

  <!-- 片段列表 -->
  <section class="card">
    <h2>2. 调整顺序 <span class="count" id="listCount">0 段</span></h2>
    <ul class="seg-list" id="segmentList"></ul>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn ghost" id="btnClear" type="button">清空列表</button>
    </div>
  </section>

  <!-- 输出与选项 -->
  <section class="card">
    <h2>3. 输出与选项</h2>
    <div class="opt-row">
      <label>输出格式</label>
      <div class="seg-control" id="formatGroup">
        <button type="button" class="seg-btn active" data-fmt="wav">WAV</button>
        <button type="button" class="seg-btn" data-fmt="mp3">MP3</button>
        <button type="button" class="seg-btn" data-fmt="m4a" id="fmtM4a" hidden>M4A</button>
      </div>
    </div>
    <div class="opt-row" id="bitrateRow" hidden>
      <label for="bitrateSel">MP3 位率</label>
      <select id="bitrateSel">
        <option value="96">96 kbps</option>
        <option value="128" selected>128 kbps</option>
        <option value="192">192 kbps</option>
        <option value="256">256 kbps</option>
        <option value="320">320 kbps</option>
      </select>
    </div>
    <div class="opt-row">
      <label for="gapRange">片段间隔</label>
      <input type="range" id="gapRange" min="0" max="3" step="0.1" value="0">
      <output id="gapValue">0.0 秒</output>
    </div>
    <label class="checkbox-row" for="normalizeChk">
      <input type="checkbox" id="normalizeChk">
      <span>峰值归一化（统一各段音量，避免某段太轻）</span>
    </label>
    <p class="hint" id="formatHint"></p>
    <p class="hint" id="sizeEst"></p>
  </section>

  <audio id="segPlayer" preload="none" hidden></audio>

  <!-- 进度 -->
  <div id="progressWrap" hidden>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span id="progressLabel">0%</span>
      <button type="button" class="btn tiny ghost" id="btnCancel">取消</button>
    </div>
  </div>

  <p id="status"></p>

  <!-- 结果 -->
  <section class="card" id="resultBox" hidden>
    <h2>4. 完成</h2>
    <!-- 大文件不自动加载：iOS 上在成功瞬间创建 objectURL + 让 audio 载入大 Blob
         会触发 WebView 内存上限导致页面被系统重载（分享按钮来不及出现） -->
    <audio id="resultAudio" controls preload="none" hidden></audio>
    <p id="resultMeta"></p>
    <div class="btn-row">
      <button class="btn ghost" id="btnPlayResult" type="button">▶ 试听结果</button>
      <button class="btn primary" id="btnShare" type="button">分享 / 下载</button>

   *   1. createSegmentConverter：无状态分帧转换器，按绝对输出帧号计算
   *      源位置——可分块调用且块边界不影响结果（与一次性转换逐位一致）；
   *   2. planMerge：先算总帧数（WAV 头部/进度都靠它）；
   *   3. concatSegments 本身也改为单遍直写输出（去掉 conform 中间层）。
   * ------------------------------------------------------------------ */

  /** 合并选项归一化（DEFAULTS + 用户覆盖） */

  /**
   * 一段源 PCM 在目标采样率下的输出帧数。
   * 与 conformPcm + resampleChannel 的长度计算保持一致；
   * 空片段返回 0（调用方按"跳过空片段"处理）。
   */

    var srcLen = srcPcm.channels[0].length;

  /**
   * 创建单段转换器：把源 PCM 的任意输出帧区间 [o0, o1) 转换为
   * 目标采样率 / 声道数 / 增益 / 淡变后的采样值。
   *
   * 无状态设计：输出帧 n 的源位置 = n / ratio（ratio = targetRate/srcRate），
   * 与一次性重采样逐位一致，因此分块调用不产生接缝。
   *
   * @param {Object} srcPcm 源 PCM（只读，绝不修改）
   * @param {Object} opts
   *   - targetRate     目标采样率
   *   - targetChannels 目标声道数
   *   - gain           统一增益（归一化用，默认 1）
   *   - fadeMs         首尾淡变毫秒数（默认 0）
   *   - int16          true 时输出 Int16（钳位+缩放公式同 floatToInt16）；
   *                    false 时输出 Float32（默认）
   * @returns {{srcRate:number, outFrames:number, convert:Function}}
   *   convert(o0, o1, outChs) → 实际转换帧数；outChs[c] 为长度 ≥ (o1-o0) 的TypedArray
   */
  function createSegmentConverter(srcPcm, opts) {
    var src = srcPcm.channels;
    var srcLen = src[0].length;
    var srcRate = srcPcm.sampleRate;
    var targetRate = opts.targetRate;
    var targetChannels = opts.targetChannels;
    var gain = typeof opts.gain === 'number' ? opts.gain : 1;
    var int16 = !!opts.int16;
    var ratio = targetRate / srcRate;
    var outFrames = conformedFrameCount(srcPcm, targetRate);
    var fadeLen = Math.min(
      Math.floor((opts.fadeMs / 1000) * targetRate),
      Math.floor(outFrames / 2)
    );
    var scratch = new Float32Array(src.length); // 每帧各源声道插值

    function emit(v, out, n) {
      if (!int16) { out[n] = v; return; }
      v = v < -1 ? -1 : (v > 1 ? 1 : v);
      out[n] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }

    function convert(o0, o1, outChs) {
      var frames = o1 - o0;
      if (frames <= 0 || outFrames === 0) return 0;
      var n, c, abs, pos, i0, t, v, g, ch;
      for (n = 0; n < frames; n++) {
        abs = o0 + n;
        pos = abs / ratio;
        i0 = Math.floor(pos);
        var hold = i0 >= srcLen - 1;
        if (hold) i0 = srcLen - 1;
        t = hold ? 0 : pos - i0;
        for (c = 0; c < src.length; c++) {
          ch = src[c];
          scratch[c] = (hold || srcLen < 2) ? ch[i0] : ch[i0] * (1 - t) + ch[i0 + 1] * t;
        }
        // 淡变增益（与 applyFadeInOut 同一公式：首尾各 fadeLen 帧线性斜坡）
        g = 1;
        if (fadeLen > 0) {
          if (abs < fadeLen) g = abs / fadeLen;
          else if (abs >= outFrames - fadeLen) g = (outFrames - 1 - abs) / fadeLen;
        }
        if (targetChannels === 1) {
          var m = 0;
          for (c = 0; c < src.length; c++) m += scratch[c] / src.length;
          emit(m * g * gain, outChs[0], n);
        } else if (src.length === targetChannels) {
          for (c = 0; c < targetChannels; c++) emit(scratch[c] * g * gain, outChs[c], n);
        } else if (src.length === 1) {
          v = scratch[0] * g * gain;
          emit(v, outChs[0], n);
          emit(v, outChs[1], n);
        } else {
          for (c = 0; c < targetChannels; c++) emit(scratch[c] * g * gain, outChs[c], n);
        }
      }
      return frames;
    }

    return { srcRate: srcRate, outFrames: outFrames, convert: convert };
  }

  /**
   * 单段在淡变后的峰值（不含归一化增益）。
   *
   * 流式合并时用于预先计算全局增益：旧实现是"先拼接再 peakNormalize"，
   * 而拼接后的全局峰值 = 各段淡变后峰值的最大者（静音间隔不贡献峰值），
   * 因此两路径等值——这里用只读扫描完成，不分配任何大数组。
   */
  function segmentPeakAfterFade(srcPcm, targetRate, targetChannels, fadeMs) {
    var src = srcPcm.channels;
    var srcLen = src[0].length;
    if (srcLen === 0) return 0;
    var ratio = targetRate / srcPcm.sampleRate;
    var outFrames = conformedFrameCount(srcPcm, targetRate);
    var fadeLen = Math.min(
      Math.floor((fadeMs / 1000) * targetRate),
      Math.floor(outFrames / 2)
    );
    var peak = 0;
    var n, c, pos, i0, t, v, g, ch, m;
    for (n = 0; n < outFrames; n++) {
      g = 1;
      if (fadeLen > 0) {
        if (n < fadeLen) g = n / fadeLen;
        else if (n >= outFrames - fadeLen) g = (outFrames - 1 - n) / fadeLen;
      }
      pos = n / ratio;
      i0 = Math.floor(pos);
      var hold = i0 >= srcLen - 1;
      if (hold) i0 = srcLen - 1;
      t = hold ? 0 : pos - i0;
      for (c = 0; c < src.length; c++) {
        ch = src[c];
        v = (hold || srcLen < 2) ? ch[i0] : ch[i0] * (1 - t) + ch[i0 + 1] * t;
        if (targetChannels === 1) {
          if (c === 0) m = 0;
          m += v / src.length;
          if (c === src.length - 1) { v = m; } else { continue; }
        } else if (src.length > 1 && c >= targetChannels) {
          continue; // 多声道目标只取前 targetChannels 条
        }
        v = Math.abs(v * g);
        if (v > peak) peak = v;

  }

  /**
   * 合并计划：各非空片段的输出帧数、间隔帧数、总帧数。
   * 与 concatSegments 的长度语义一致（跳过空片段、段间插间隔）。
   * @returns {{targetSampleRate, targetChannels, gapFrames,
   *            parts:Array<{index:number, outFrames:number}>, totalFrames}}

    var i;

      var seg = segments[i];
      if (!seg || !seg.pcm || !seg.pcm.channels || seg.pcm.channels.length === 0) {
        throw new Error('planMerge: 第 ' + (i + 1) + ' 个片段数据无效');
      }
      var frames = conformedFrameCount(seg.pcm, opts.targetSampleRate);
      if (frames === 0) continue; // 跳过空片段（与 concatSegments 一致）
      parts.push({ index: i, outFrames: frames });

    if (parts.length === 0) {
      throw new Error('planMerge: 所有片段均为空');

    for (i = 0; i < parts.length; i++) totalFrames += parts[i].outFrames;

      targetSampleRate: opts.targetSampleRate,
      targetChannels: opts.targetChannels,
      gapFrames: gapFrames,
      parts: parts,
      totalFrames: totalFrames
    };
  }

  /* ------------------------------------------------------------------ *
   * 合并主流程
   * ------------------------------------------------------------------ */

  /**
   * 合并多段 PCM（单遍直写：输出只分配一次，逐段转换填入，
   * 不再为每段建立全量 conform 中间拷贝）。
   *
   * @param {Array<{name:string, pcm:Object}>} segments 按顺序排列的片段

    // 归一化全局增益：等价于旧实现"拼接后 peakNormalize"
    // （拼接后峰值 = 各段淡变后峰值的最大者）
    var gain = 1;
    if (opts.normalize) {
      var peak = 0;
      for (i = 0; i < plan.parts.length; i++) {
        var pk = segmentPeakAfterFade(
          segments[plan.parts[i].index].pcm,
          plan.targetSampleRate, plan.targetChannels, opts.fadeMs
        );
        if (pk > peak) peak = pk;
      }
      if (peak > 0 && isFinite(peak)) {

    var CHUNK = 65536; // 转换块大小（仅影响速度，不影响结果）
    var offset = 0;
    for (i = 0; i < plan.parts.length; i++) {
      var part = plan.parts[i];
      var conv = createSegmentConverter(segments[part.index].pcm, {
        targetRate: plan.targetSampleRate,
        targetChannels: plan.targetChannels,
        gain: gain,
        fadeMs: opts.fadeMs,
        int16: false
      });
      var done = 0;
      while (done < part.outFrames) {
        var end = Math.min(done + CHUNK, part.outFrames);
        // convert 的 outChs 索引是窗口内局部索引——传输出数组对应区段的子视图
        var views = [];
        for (c = 0; c < opts.targetChannels; c++) {
          views.push(out[c].subarray(offset + done, offset + end));
        }
        conv.convert(done, end, views);
        done = end;
      }
      // 段间间隔：输出数组零初始化，天然就是静音，无需显式写
      offset += part.outFrames + plan.gapFrames;
    }
    return { sampleRate: plan.targetSampleRate, channels: out };
  }

  /* ------------------------------------------------------------------ *
   * WAV 编码（RIFF/WAVE，PCM）
   * ------------------------------------------------------------------ */

  /**

   * 流式合并时先写头部再写数据——总帧数在合并前即可由 planMerge 算出。
   * @param {number} numFrames 每声道帧数
   * @param {number} sampleRate 采样率

    var view = new DataView(buffer);

      for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
    }
    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true); // 文件总大小 - 8
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);                    // fmt 块大小
    view.setUint16(20, 1, true);                     // 格式：PCM
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true); // 字节率
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitDepth, true);
    writeStr(36, 'data');
    view.setUint32(40, dataSize, true);
    return new Uint8Array(buffer);
  }

  /**
   * 将 PCM 编码为 WAV 字节流。
   * @param {Object} pcm
   * @param {number} [bitDepth=16] 8 / 16 / 24 / 32
   * @returns {Uint8Array}
   */

    var blockAlign = numChannels * bytesPerSample;

    }

        for (c = 0; c < numChannels; c++) {

          view.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7fff, true);
          off += 2;
        }
      }

          v = clamp(pcm.channels[c][i]);
          view.setUint8(off, Math.round(v * 127) + 128);
          off += 1;
        }
      }

      for (i = 0; i < numFrames; i++) {
        for (c = 0; c < numChannels; c++) {

          var s = v < 0 ? v * 0x800000 : v * 0x7fffff;
          s = Math.round(s);
          view.setUint8(off, s & 0xff);
          view.setUint8(off + 1, (s >> 8) & 0xff);
          view.setUint8(off + 2, (s >> 16) & 0xff);
          off += 3;
        }
      }
    } else {
      for (i = 0; i < numFrames; i++) {
        for (c = 0; c < numChannels; c++) {
          v = clamp(pcm.channels[c][i]);
          view.setInt32(off, v < 0 ? v * 0x80000000 : v * 0x7fffffff, true);
          off += 4;
        }
      }
    }
    return new Uint8Array(buffer);
  }

  /* ------------------------------------------------------------------ *
   * MP3 编码（lamejs 由外部注入，核心库不硬依赖）
   * ------------------------------------------------------------------ */

  /** 单条 Float32 声道 → Int16（lamejs 输入格式，带钳位） */

    for (var i = 0; i < channel.length; i++) {
      var v = channel[i];

      out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return out;
  }

  function pcmToInt16Channels(pcm) {
    return pcm.channels.map(function (ch) { return floatToInt16(ch); });
  }

  /**
   * MP3 编码（异步、分块、可取消）。
   *
   * @param {Object} pcm {sampleRate, channels: Float32Array[]}
   * @param {Object} opts
   *   - lamejs    必填，lamejs 库对象（浏览器里是 window.lamejs）
   *   - kbps      位率，默认 128（LAME 支持 8–320）
   *   - blockFrames 每块采样数，默认 1152*50（44.1kHz 约 1.3 秒/块）
   *   - yieldFn   每块之间让出主线程的函数，用于刷新进度条（默认微任务）
   *   - onProgress (0..1) 进度回调
   *   - isCanceled 返回 true 则中止，抛出 code 为 'CANCELED' 的错误

    var enc = new opts.lamejs.Mp3Encoder(numChannels, sampleRate, kbps);
    var chunks = [];
    var totalBytes = 0;
    var lastReported = -1; // 保证进度严格单调递增（末块与 flush 都可能到 1）

    for (var i = 0; i < total; i += blockFrames) {
      if (isCanceled()) {
        var cancelErr = new Error('已取消');
        cancelErr.code = 'CANCELED';
        throw cancelErr;
      }
      var end = Math.min(i + blockFrames, total);
      var left = int16[0].subarray(i, end);
      var right = numChannels > 1 ? int16[1].subarray(i, end) : null;
      var buf = numChannels > 1 ? enc.encodeBuffer(left, right) : enc.encodeBuffer(left);
      if (buf && buf.length > 0) {
        // lamejs 返回 Int8Array 视图；按字节原样转 Uint8Array（不能按值转换）
        var chunk = new Uint8Array(buf.buffer, buf.byteOffset, buf.length);
        chunks.push(chunk);
        totalBytes += chunk.length;
      }
      if (opts.onProgress && end / total > lastReported) {
        lastReported = end / total;
        opts.onProgress(lastReported);
      }
      if (end < total) await yieldFn();
    }

    var flushBuf = enc.flush();
    if (flushBuf && flushBuf.length > 0) {
      var fchunk = new Uint8Array(flushBuf.buffer, flushBuf.byteOffset, flushBuf.length);
      chunks.push(fchunk);
      totalBytes += fchunk.length;
    }
    if (opts.onProgress && lastReported < 1) opts.onProgress(1);

    var out = new Uint8Array(totalBytes);
    var off = 0;
    for (var c = 0; c < chunks.length; c++) {
      out.set(chunks[c], off);
      off += chunks[c].length;
    }
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 格式嗅探与兜底解码（V0.3.2）
   *
   * 平台 decodeAudioData 失败时（Android 各厂商内核、桌面 Chrome 的 AAC 等），
   * 先用魔数判断"实际是什么格式"，再决定：
   *   - 能用内置解析器的（WAV / MP3）直接解；
   *   - 不能的，给出精确原因与可操作建议，而不是笼统的“解码失败”。
   * ------------------------------------------------------------------ */

  /**
   * 魔数嗅探：识别容器 / 编码。

        label: '空文件（0 字节）',
        advice: '可能是云盘文件未下载完成，或读取被系统拦截；请先把文件保存到本机再导入'

      return {

        label: 'M4A/MP4 容器（' + (brand || '未知品牌') + '，音频通常为 AAC）',
        advice: '桌面版 Chrome/Edge 不解码 AAC；手机上如仍失败，请转为 MP3 或 WAV'

  }

  function cancelMerge() {
    if (!state.busy) return;
    state.mergeToken++;
    if (state.m4aRecorder) {
      try { state.m4aRecorder.stop(); } catch (e) { /* 忽略 */ }
    }
    setStatus('正在取消…');
  }

  /* ---------------- 音频上下文与解码 ---------------- */
  function getCtx() {
    if (!state.audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('当前浏览器不支持 Web Audio API');
      state.audioCtx = new AC();
    }
    if (state.audioCtx.state === 'suspended') {
      return state.audioCtx.resume().then(function () { return state.audioCtx; });
    }
    return Promise.resolve(state.audioCtx);
  }

  function decodeAudioData(arrayBuffer) {
    // 同时兼容新版（Promise）与旧版（回调）API
    return new Promise(function (resolve, reject) {
      var p = state.audioCtx.decodeAudioData(arrayBuffer, resolve, reject);
      if (p && typeof p.then === 'function') p.then(resolve, reject);
    });
  }

  /**
   * AudioBuffer → 内部 PCM 格式（零拷贝：直接持有声道视图）。
   * 安全性：合并管线从不原地修改输入——conformPcm 先 slice 再处理，
   * 编码路径只读。省掉一次全量拷贝（11 分钟立体声约省 120 MB 内存峰值）。
   */
  function audioBufferToPcm(buf) {
    var channels = [];
    for (var c = 0; c < buf.numberOfChannels; c++) channels.push(buf.getChannelData(c));
    return { sampleRate: buf.sampleRate, channels: channels };
  }

  function readAsArrayBuffer(blob) {
    if (typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(new Error('文件读取失败')); };
      fr.readAsArrayBuffer(blob);
    });
  }

  /* ---------------- 片段管理 ---------------- */
  function totalDuration() {
    var sum = 0;
    state.segments.forEach(function (s) { sum += s.duration || 0; });
    return sum;
  }

  function estimateTargetRate() {
    var rates = [];
    state.segments.forEach(function (s) { if (s.pcm) rates.push(s.pcm.sampleRate); });
    return AudioCore.pickTargetRate(rates);
  }

  /**
   * 文件入队：立即生成「解码中」占位片段并渲染（用户瞬间看到反馈），
   * 然后按队列顺序解码，控制内存峰值。
   */
  function enqueueFiles(files) {
    var added = [];
    Array.prototype.forEach.call(files || [], function (file) {
      if (!file) return;
      state.seq++;
      var seg = {
        id: 'seg' + state.seq,
        name: file.name || '未命名音频',
        source: '导入',
        blob: file,
        decoding: true,
        failed: false,
        pcm: null,
        audioBuffer: null, // 解码时的 AudioBuffer（M4A 调度零拷贝复用）
        released: false,   // PCM 是否已在合并中被释放（重试时自动重新解码）
        duration: 0,
        sampleRate: 0,
        channels: 0
      };
      state.segments.push(seg);
      added.push(seg);
    });
    if (!added.length) return;
    renderList();
    setStatus('已加入 ' + added.length + ' 个文件，正在解码（' + added[0].name + '）…');
    added.forEach(function (seg) { decodeQueue.push(seg); });
    pumpQueue();
  }

  function pumpQueue() {
    if (decodeRunning) return;
    var seg = decodeQueue.shift();
    if (!seg) return;
    decodeRunning = true;
    decodeSegment(seg).then(function () {
      decodeRunning = false;
      pumpQueue();
    });
  }

  /* ---------------- 解码降级链（V0.3.2） ----------------
   * 平台 decodeAudioData 在部分环境会失败（Android 厂商内核、桌面 Chrome 的
   * AAC、含异常标签的 MP3 等）。失败后按魔数嗅探实际格式，能用内置解析器的
   * 直接解：WAV → 自研 RIFF 解析器；MP3 → mp3 解码器（lamejs 只编码，
   * 因此内置 wasm 版 mpg123）。仍不支持的格式给出精确原因与建议。
   * ------------------------------------------------------ */
  var mp3DecoderLib = null;
  var mp3DecoderPromise = null;

  /** 从内联 base64 还原并执行 mpg123-decoder（NUL 安全，原因见 build.js 注释） */
  function loadMp3DecoderModule() {
    if (window['mpg123-decoder']) return;
    var b64 = window.__MP3DEC_B64;
    if (!b64) throw new Error('内置解码器未随页面加载');
    if (typeof TextDecoder !== 'function') {
      throw new Error('浏览器缺少 TextDecoder，无法启用内置解码器');
    }
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var src = new TextDecoder('utf-8').decode(bytes);
    (0, eval)(src); // 间接 eval：在全局作用域执行 UMD，挂载 window['mpg123-decoder']
  }

  /** 惰性初始化内置 MP3 解码器（仅在平台解码失败时加载，不增加正常路径成本） */
  function getMp3Decoder() {
    if (mp3DecoderPromise) return mp3DecoderPromise;
    try {
      loadMp3DecoderModule();
    } catch (e) {
      mp3DecoderPromise = Promise.reject(e);
      return mp3DecoderPromise;
    }
    var lib = window['mpg123-decoder'];
    if (!lib || typeof lib.MPEGDecoder !== 'function') {
      mp3DecoderPromise = Promise.reject(new Error('内置 MP3 解码器未加载'));
      return mp3DecoderPromise;
    }
    mp3DecoderLib = new lib.MPEGDecoder();
    mp3DecoderPromise = mp3DecoderLib.ready.then(function () { return mp3DecoderLib; });
    return mp3DecoderPromise;
  }

  /**
   * 兜底解码：按嗅探到的实际格式选择内置解析器。
   * @param {Uint8Array} bytes 文件字节
   * @param {Object} info sniffFormat 结果
   * @returns {Promise<{pcm:Object, decoder:string}|null>} null = 该格式无内置解析器
   */
  async function fallbackDecode(bytes, info) {
    if (info.container === 'wav') {
      return { pcm: AudioCore.decodeWav(bytes), decoder: 'wav' };
    }
    if (info.container === 'mp3') {
      var dec = await getMp3Decoder();
      var out = await dec.decode(bytes);
      if (!out || !out.samplesDecoded || !out.channelData || !out.channelData.length) {
        throw new Error('内置 MP3 解码器未产出音频数据');
      }
      // mpg123 会把单声道上混为双声道；channelData 是每次 decode 新分配的
      // Float32Array（非 wasm 堆视图），可直接作为 PCM 声道持有
      return {
        pcm: { sampleRate: out.sampleRate, channels: out.channelData },
        decoder: 'mpg123'
      };
    }
    return null;
  }

  async function decodeSegment(seg) {
    try {
      var buf = await readAsArrayBuffer(seg.blob);
      await getCtx();

      /* ⚠️ 关键约定：decodeAudioData 会接管（detach）传入的 ArrayBuffer，
       * 而且**失败时也 detach**（Chrome/WebKit 实测：成功/失败两种路径事后
       * byteLength 均为 0）。因此任何"解码之后还要用的字节"都必须是独立副本，
       * 不能直接持有同一个 buffer 的视图——否则降级链拿到的永远是 0 字节，
       * 会被误判成"空文件（0 字节）"。
       *
       * 做法：解码前先用 slice 复制一份头部（≤64KB）用于嗅探；只有当嗅探结果
       * 表明有对应内置解析器时，才在失败后重新读一次全文交给兜底解析器。
       * 这样成功路径零额外开销，失败路径也只有一次按需重读。 */
      var headLen = Math.min(buf.byteLength, SNIFF_HEAD_BYTES);
      var headBytes = new Uint8Array(buf.slice(0, headLen)); // slice = 独立副本

      var audioBuf = null;
      var primaryErr = null;
      try {
        audioBuf = await decodeAudioData(buf);
      } catch (e) {
        primaryErr = e; // 平台解码器失败 → 走降级链
      }
      // 解码期间该片段可能已被移除
      if (!state.segments.some(function (s) { return s.id === seg.id; })) return;

      /* 部分损坏/不被支持的文件，平台解码器会"成功"返回一个 0 帧的 AudioBuffer
       * （Chrome/Edge 实测：魔数合法但内容无效的 MP3 → duration 0、不报错）。
       * 若按成功处理，合并时该段会被 planMerge 静默跳过——用户那一段无声无息消失，
       * 全是这类文件时还会抛出内部的 "planMerge: 所有片段均为空"。因此必须当失败，
       * 并继续走降级链让内置解析器再试一次。 */
      var platformSuspicious = false;
      if (audioBuf && audioBuf.length === 0) {
        primaryErr = new Error('平台解码器返回了 0 帧音频（文件很可能损坏或不完整）');
        audioBuf = null;
        platformSuspicious = true;
      } else if (audioBuf && audioBuf.duration < MIN_VALID_SEC) {
        primaryErr = new Error('平台解码器只解出 ' + (audioBuf.duration * 1000).toFixed(0) +
          ' 毫秒音频（文件很可能损坏或不完整）');
        audioBuf = null;
        platformSuspicious = true;
      }

      if (audioBuf) {
        seg.pcm = audioBufferToPcm(audioBuf);
        seg.audioBuffer = audioBuf; // 保留引用：M4A 调度可直接复用
        seg.warn = null; // 平台这次解好了，清掉此前可能存在的"结果存疑"警示
        seg.duration = audioBuf.duration;
        seg.sampleRate = audioBuf.sampleRate;
        seg.channels = audioBuf.numberOfChannels;
        seg.decoding = false;
        renderList();
        var rest = decodeQueue.length;
        setStatus('已解码「' + seg.name + '」（' + fmtTime(seg.duration) + '）' +
          (rest > 0 ? '，队列还剩 ' + rest + ' 个' : '') +
          '。当前共 ' + state.segments.length + ' 段，合计 ' + fmtTime(totalDuration()));
        return;
      }

      // ---- 降级链 ----
      // 注意：此处只能用 headBytes（独立副本）。传给平台解码器的那份 buf 已在上一步
      // 被 detach，任何基于它的视图长度都会变成 0。
      var info = AudioCore.sniffFormat(headBytes);
      seg.sniff = info;
      var fb = null, fbErr = null;
      try {
        if (info.container === 'wav' || info.container === 'mp3') {
          // 内置解析器需要完整文件；平台那一份已被 detach，这里按需重读
          var fullBuf = await readAsArrayBuffer(seg.blob);
          fb = await fallbackDecode(new Uint8Array(fullBuf), info);
        }
      } catch (e2) {
        fbErr = e2;
      }
      if (!state.segments.some(function (s) { return s.id === seg.id; })) return;
      // 兜底解析器同样可能产出 0 帧或垃圾短解（例如 mpg123 空解），一样按失败处理，
      // 绝不允许"静默消失"或"只有几十毫秒"的片段混进列表。
      var fbSec = fb ? AudioCore.pcmDurationSec(fb.pcm) : 0;
      if (fb && fbSec < MIN_VALID_SEC) {
        fb = null;
        fbErr = new Error('内置解析器只解出 ' + (fbSec * 1000).toFixed(0) +
          ' 毫秒音频，文件很可能损坏');
      }
      if (fb) {
        seg.pcm = fb.pcm;
        seg.audioBuffer = null; // 无 AudioBuffer，M4A 路径会按 PCM 重建
        seg.duration = AudioCore.pcmDurationSec(fb.pcm);
        seg.sampleRate = fb.pcm.sampleRate;
        seg.channels = fb.pcm.channels.length;
        seg.decoding = false;
        seg.usedFallback = true;
        // 平台只解出一小段（典型：损坏 MP3 被解成几十毫秒噪声）时，内置解析器的结果
        // 未必可信——它可能是把垃圾数据硬解出来的。此时仍采用其输出（否则那段会静默消失），
        // 但必须显式标注，让用户试听确认后再决定是否留下。
        seg.warn = platformSuspicious
          ? '平台解码结果异常短，内容由内置解码器还原，请试听确认后再合并'
          : null;
        var label = (fb.decoder === 'mpg123' ? 'MP3/MPEG' : 'WAV');
        renderList();
        if (platformSuspicious) {
          setStatus('「' + seg.name + '」平台解码结果异常，已改用内置解码器（' + label +
            '）解出 ' + fmtTime(seg.duration) +
            '，请试听确认内容是否完整，若不满意可删除该片段');
        } else {
          setStatus('「' + seg.name + '」平台解码器不支持，已用内置解码器（' + label +
            '）解码完成：' + fmtTime(seg.duration) + '，合计 ' + fmtTime(totalDuration()));
        }
        return;
      }
      // 无内置解析器：抛出带格式信息与建议的错误
      throw decorateDecodeError(seg, info, primaryErr, fbErr);
    } catch (err) {
      if (!state.segments.some(function (s) { return s.id === seg.id; })) return;
      seg.decoding = false;
      seg.failed = true;
      seg.errorMsg = err && err.message ? err.message : String(err);
      renderList();
      setStatus(seg.errorMsg, true);
    }
  }

  /** 组装可操作的解码失败信息（含文件大小、检测格式、建议） */
  function decorateDecodeError(seg, info, primaryErr, fbErr) {
    var sizeTxt = seg.blob && typeof seg.blob.size === 'number' ? fmtSize(seg.blob.size) : '大小未知';
    var reason = primaryErr && primaryErr.message ? primaryErr.message : '平台解码器拒绝该文件';
    var parts = [
      '「' + seg.name + '」解码失败：' + reason,
      '（文件 ' + sizeTxt + ' · 检测为 ' + (info.label || '未知格式') + '）'
    ];
    if (info.advice) parts.push('。建议：' + info.advice + '（转换方法见页脚「格式转换」）');
    else if (fbErr) parts.push('。内置解析器也失败：' + (fbErr.message || fbErr));
    else parts.push('。可能是文件损坏或不完整，可尝试重新导出该文件，或点下方「兼容模式」重新选择');
    return new Error(parts.join(''));
  }

  function removeSegment(id) {
    // 合并进行中禁止增删：streamMerge 持有的是开始时捕获的片段数组，
    // 此时删除只会从界面上消失，结果里仍然包含——必须先取消合并
    if (state.busy) {
      setStatus('合并进行中：请先取消合并，再调整片段列表', true);
      return;
    }
    var seg = state.segments.find(function (s) { return s.id === id; });
    if (seg && state.playingId === id) stopSegPlayback();
    if (seg && seg.url) { URL.revokeObjectURL(seg.url); seg.url = null; }
    state.segments = state.segments.filter(function (s) { return s.id !== id; });
    renderList();
  }

  function moveSegment(id, dir) {
    if (state.busy) { // 同 removeSegment：合并中调整顺序不影响已捕获的合并数组
      setStatus('合并进行中：请先取消合并，再调整片段列表', true);
      return;
    }
    var idx = state.segments.findIndex(function (s) { return s.id === id; });
    if (idx < 0) return;
    var target = idx + dir;
    if (target < 0 || target >= state.segments.length) return;
    var tmp = state.segments[idx];
    state.segments[idx] = state.segments[target];
    state.segments[target] = tmp;
    renderList();
  }

  /* ---------------- 片段试听 ---------------- */
  function stopSegPlayback() {
    var player = $('segPlayer');
    try { player.pause(); } catch (e) { /* 忽略 */ }
    player.removeAttribute('src');
    state.playingId = null;
  }

  function toggleSegPlayback(id) {
    var player = $('segPlayer');
    if (state.playingId === id) {
      stopSegPlayback();
      renderList(true);
      setStatus('已停止试听');
      return;
    }
    var seg = state.segments.find(function (s) { return s.id === id; });
    if (!seg) return;
    if (!seg.blob || seg.decoding || seg.failed) {
      setStatus('该片段暂不可试听', true);
      return;
    }
    stopSegPlayback();
    if (!seg.url) seg.url = URL.createObjectURL(seg.blob);
    player.src = seg.url;
    state.playingId = id;
    renderList(true);
    player.play().then(function () {
      setStatus('正在试听「' + seg.name + '」，再次点击 ▶ 停止');
    }).catch(function (err) {
      setStatus('播放失败：' + (err && err.message ? err.message : err), true);
      stopSegPlayback();
      renderList(true);
    });
  }

  /* ---------------- 输出格式 ---------------- */
  function detectFormats() {
    // M4A 依赖 MediaRecorder 的 mp4 录制能力（iOS Safari / 较新 Chrome/Edge）
    if (typeof MediaRecorder !== 'undefined' &&
        (MediaRecorder.isTypeSupported('audio/mp4') ||
         MediaRecorder.isTypeSupported('audio/mp4;codecs=mp4a.40.2'))) {
      state.m4aSupported = true;
      $('fmtM4a').hidden = false;
    }
    // MP3 依赖内联的 lamejs
    if (!(window.lamejs && typeof window.lamejs.Mp3Encoder === 'function')) {
      var mp3Btn = document.querySelector('#formatGroup .seg-btn[data-fmt="mp3"]');
      if (mp3Btn) {
        mp3Btn.disabled = true;
        mp3Btn.title = '编码器未加载';
      }
    }
  }

  function setFormat(fmt) {
    if (fmt === 'm4a' && !state.m4aSupported) return;
    state.format = fmt;
    var btns = document.querySelectorAll('#formatGroup .seg-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i].dataset.fmt === fmt);
    }
    $('bitrateRow').hidden = fmt !== 'mp3';
    updateFormatHint();
    updateSizeEstimate();
    updateMergeButton();
  }

  function updateFormatHint() {
    var hint;
    if (state.format === 'wav') {
      hint = 'WAV 无损：约 ' + fmtSize(estimateTargetRate() * 4) + '/秒，兼容性最好，适合存档。';
      if (isIOSDevice()) {
        hint += 'iOS 上超大 WAV 可能因内存限制被浏览器重载，长音频建议选 MP3 或分段合并。';
      }
    } else if (state.format === 'mp3') {
      hint = 'MP3 有损压缩：体积约为 WAV 的 1/10，编码在本地完成，长文件需要几十秒。';
    } else {
      hint = 'M4A(AAC) 实时编码：按播放速度录制合并结果，耗时与音频等长，期间请保持页面在前台。';
    }
    $('formatHint').textContent = hint;
  }

  function updateSizeEstimate() {
    var dur = totalDuration();
    if (dur <= 0) {
      $('sizeEst').textContent = '';
      return;
    }
    var rate = estimateTargetRate();
    var bytes;
    if (state.format === 'wav') bytes = dur * rate * 2 * 2;          // 立体声 16bit
    else if (state.format === 'mp3') bytes = dur * state.bitrate * 1000 / 8;
    else bytes = dur * 128000 / 8;                                    // M4A 按 128kbps 估
    $('sizeEst').textContent = '预计约 ' + fmtSize(bytes) +
      '（' + Math.round(rate / 1000) + 'kHz · 当前 ' + state.segments.length +
      ' 段合计 ' + fmtTime(dur) + '）';
  }

  /* ---------------- 列表渲染 ---------------- */
  /** 清理已生成的合并结果（列表变动后结果即过期） */
  function hideResult() {
    var a = $('resultAudio');
    try { a.pause(); } catch (e) { /* 忽略 */ }
    a.removeAttribute('src');
    a.hidden = true;
    if (state.mergedUrl) {
      URL.revokeObjectURL(state.mergedUrl);
      state.mergedUrl = null;
    }
    state.mergedBlob = null;
    $('resultBox').hidden = true;
  }

  function updateActionBar() {
    var bar = $('actionBar');
    if (state.segments.length === 0) {
      bar.hidden = true;
      return;
    }
    bar.hidden = false;
    var decoding = decodingCount();
    var text = state.segments.length + ' 段 · 合计 ' + fmtTime(totalDuration());
    if (decoding > 0) text = '解码中 ' + decoding + ' 个…（' + text + '）';
    $('actionSummary').textContent = text;
  }

  /**
   * 渲染片段列表。
   * @param {boolean} [keepResult] 为 true 时不清理已生成的合并结果（试听场景用）
   */
  function renderList(keepResult) {
    if (!keepResult) hideResult();
    updateActionBar();
    updateSizeEstimate();
    updateMergeButton();

    var ul = $('segmentList');
    ul.textContent = '';

    if (state.segments.length === 0) {
      ul.appendChild(el('li', 'empty', '还没有片段。导入音频文件，或点击上方按钮开始录音。'));
      $('listCount').textContent = '0 段';
      return;
    }

    $('listCount').textContent =
      state.segments.length + ' 段 · 合计 ' + fmtTime(totalDuration());

    state.segments.forEach(function (seg, i) {
      var cls = 'seg';
      if (seg.decoding) cls += ' decoding';
      if (seg.failed) cls += ' failed';
      var li = el('li', cls);
      li.dataset.id = seg.id;
      if (state.playingId === seg.id) li.classList.add('playing');

      li.appendChild(el('span', 'seg-idx', String(i + 1)));

      var play = el('button', 'icon-btn play', state.playingId === seg.id ? '⏸' : '▶');
      play.type = 'button';
      play.title = '试听';
      play.dataset.act = 'play';
      if (seg.decoding || seg.failed) play.disabled = true;
      li.appendChild(play);

      var info = el('div', 'seg-info');
      info.appendChild(el('div', 'seg-name', seg.name));
      var meta;
      if (seg.decoding) {
        meta = '解码中…';
      } else if (seg.failed) {
        meta = '解码失败：' + (seg.errorMsg || '格式不支持');
      } else {
        meta = seg.source + (seg.usedFallback ? '（内置解码）' : '') + ' · ' +
          fmtTime(seg.duration) +
          ' · ' + Math.round(seg.sampleRate / 1000) + 'kHz · ' +
          (seg.channels === 1 ? '单声道' : seg.channels + ' 声道');
      }
      info.appendChild(el('div', 'seg-meta', meta));
      if (seg.warn) info.appendChild(el('div', 'seg-warn', '⚠ ' + seg.warn));
      li.appendChild(info);

      var actions = el('div', 'seg-actions');
      var up = el('button', 'icon-btn', '↑');
      up.type = 'button';
      up.title = '上移';
      up.dataset.act = 'up';
      if (i === 0) up.disabled = true;
      var down = el('button', 'icon-btn', '↓');
      down.type = 'button';
      down.title = '下移';
      down.dataset.act = 'down';
      if (i === state.segments.length - 1) down.disabled = true;
      var del = el('button', 'icon-btn danger', '✕');
      del.type = 'button';
      del.title = '移除';
      del.dataset.act = 'del';
      actions.appendChild(up);
      actions.appendChild(down);
      actions.appendChild(del);
      li.appendChild(actions);

      ul.appendChild(li);
    });
  }

  /* ---------------- 录音 ---------------- */
  /** 微信内置浏览器检测（UA 含 MicroMessenger） */
  function isWeChat() {
    return /MicroMessenger/i.test(navigator.userAgent);
  }

  /** 微信内的操作引导（内置浏览器对麦克风/文件选择限制较多） */
  function weChatTip() {
    return isWeChat()
      ? '。微信内置浏览器限制较多，请点右上角 ⋯ 选择「用默认浏览器打开」'
      : '';
  }

  function pickMimeType() {
    if (typeof MediaRecorder === 'undefined') return null;
    var candidates = [
      'audio/mp4;codecs=mp4a.40.2', // iOS Safari
      'audio/mp4',
      'audio/webm;codecs=opus',     // Android Chrome
      'audio/webm',
      'audio/ogg;codecs=opus'
    ];
    for (var i = 0; i < candidates.length; i++) {
      if (MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return '';
  }

  async function toggleRecord() {
    if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
      state.mediaRecorder.stop();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('当前浏览器不支持录音（需要 HTTPS 或 localhost 环境）' + weChatTip(), true);
      return;
    }
    if (typeof MediaRecorder === 'undefined') {
      setStatus('当前浏览器不支持 MediaRecorder', true);
      return;
    }
    // 权限弹窗前预热（弹窗在手机上要好几秒）
    warmAudioPipeline();
    try {
      setStatus('正在请求麦克风权限…');
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      var mimeType = pickMimeType();
      state.recordChunks = [];
      state.mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : undefined);
      state.mediaRecorder.ondataavailable = function (e) {
        if (e.data && e.data.size > 0) state.recordChunks.push(e.data);
      };
      state.mediaRecorder.onstop = onRecordStop;
      state.mediaRecorder.start(1000);
      state.recordStart = Date.now();
      $('btnRecord').textContent = '停止录音';
      $('btnRecord').classList.add('recording');
      $('recordDot').hidden = false;
      $('recordTime').textContent = '0:00';
      state.recordTimer = setInterval(function () {
        $('recordTime').textContent = fmtTime((Date.now() - state.recordStart) / 1000);
      }, 250);
      setStatus('录音中…（格式：' + (mimeType || '浏览器默认') + '）');
    } catch (err) {
      console.error(err);
      var msg = err && err.name === 'NotAllowedError'
        ? '麦克风权限被拒绝，请在浏览器设置中允许后重试' +
          (isWeChat() ? '；或点右上角 ⋯ 用默认浏览器打开' : '')
        : '无法启动录音：' + (err && err.message ? err.message : err);
      setStatus(msg, true);
    }
  }

  async function onRecordStop() {
    clearInterval(state.recordTimer);
    $('btnRecord').textContent = '开始录音';
    $('btnRecord').classList.remove('recording');
    $('recordDot').hidden = true;
    var mr = state.mediaRecorder;
    state.mediaRecorder = null;
    if (mr && mr.stream) {
      mr.stream.getTracks().forEach(function (t) { t.stop(); });
    }
    if (!state.recordChunks.length) {
      setStatus('录音为空，已取消');
      return;
    }
    var blob = new Blob(state.recordChunks, { type: state.recordChunks[0].type || 'audio/webm' });
    setStatus('录音结束（' + fmtSize(blob.size) + '），加入列表并解码…');
    enqueueFiles([new File([blob], '录音 ' + nowStamp() + '.' + guessExt(blob.type), { type: blob.type })]);
  }

  function guessExt(mime) {
    if (/mp4|m4a|aac/i.test(mime)) return 'm4a';
    if (/ogg/i.test(mime)) return 'ogg';
    if (/webm/i.test(mime)) return 'webm';
    return 'audio';
  }

  /* ---------------- 合并与导出 ---------------- */
  function canceledError() {
    var e = new Error('已取消');
    e.code = 'CANCELED';
    return e;
  }

  /* ---------------- 流式合并（V0.3.0） ----------------
   * 长音频合并的内存瓶颈是"整体物化"：旧流程先为每段建全量 conform 拷贝，
   * 再建全量输出 PCM，最后整体编码——两个 40 分钟立体声文件峰值可超 4GB
   * （用户实测），iOS 直接杀页面重载。新流程：
   *   1. 分块转换（AudioCore.createSegmentConverter，块边界无接缝）；
   *   2. 输出直接写文件——优先 OPFS（Origin Private File System）落盘，
   *      不可用时回落内存块拼接；
   *   3. 每段消费完立即释放其解码数据（保留 blob，重试时自动重新解码）；
   *   4. M4A 改用 AudioBuffer 顺序调度进 MediaRecorder，不再整体拷贝。
   * ----------------------------------------------------------- */

  var OPFS_PREFIX = 'audio-merge-';
  var MERGE_CHUNK_FRAMES = 32768; // 输出帧/块（48kHz 约 0.68s）

  /**
   * 打开 OPFS 写通道（流式输出的落盘位置）。
   * 优先 createSyncAccessHandle（Chrome/Edge 108+），回落 createWritable；
   * 均不可用（旧 Safari 等）返回 null，调用方回落内存拼接。
   */
  async function openMergeSink(ext) {
    if (!navigator.storage || typeof navigator.storage.getDirectory !== 'function') return null;
    var name = OPFS_PREFIX + nowStamp() + '.' + ext;
    try {
      var dir = await navigator.storage.getDirectory();
      var handle = await dir.getFileHandle(name, { create: true });
      if (typeof handle.createSyncAccessHandle === 'function') {
        var access = await handle.createSyncAccessHandle();
        access.truncate(0);
        return {
          opfs: true,
          name: name,
          write: function (bytes) { access.write(bytes); return Promise.resolve(); },
          finish: async function () {
            try { access.flush(); } catch (e) { /* 忽略 */ }
            access.close();
            return await handle.getFile(); // OPFS File：磁盘支撑的 Blob，不占内存
          },
          abort: function () { try { access.close(); } catch (e) { /* 忽略 */ } }
        };
      }
      if (typeof handle.createWritable === 'function') {
        var writable = await handle.createWritable();
        return {
          opfs: true,
          name: name,
          write: async function (bytes) { await writable.write(bytes); },
          finish: async function () {
            await writable.close();
            return await handle.getFile();
          },
          abort: async function () { try { await writable.abort(); } catch (e) { /* 忽略 */ } }
        };
      }
      return null;
    } catch (e) {
      return null;
    }
  }

  /** 清理历史合并留下的 OPFS 文件（保留当前结果文件，防止无限增长） */
  async function cleanOldOpfsFiles(keepName) {
    if (!navigator.storage || typeof navigator.storage.getDirectory !== 'function') return;
    try {
      var dir = await navigator.storage.getDirectory();
      if (typeof dir.entries !== 'function') return;
      // 手动迭代（不用 for-await）：把语法基线压在 ES2017，
      // 兼容 Chromium 55–62 一类旧内核的厂商浏览器
      var names = [];
      var it = dir.entries();
      var step = await it.next();
      while (!step.done) {
        var name = String(step.value[0]);
        if (name.indexOf(OPFS_PREFIX) === 0 && name !== keepName) names.push(name);
        step = await it.next();
      }
      for (var i = 0; i < names.length; i++) {
        try { await dir.removeEntry(names[i]); } catch (e) { /* 忽略 */ }
      }
    } catch (e) { /* 迭代不可用（旧浏览器）则跳过清理 */ }
  }

  /** 释放已消费片段的解码数据（保留 blob 与元数据；重试时自动重新解码） */
  function releaseSegmentPcm(seg) {
    seg.pcm = null;
    seg.audioBuffer = null;
    seg.released = true;
  }

  /** 合并前确保所有片段都有解码数据（被释放过的重新解码） */
  async function ensureAllDecoded() {
    var pending = state.segments.filter(function (s) { return s.released && !s.failed; });
    for (var i = 0; i < pending.length; i++) {
      var seg = pending[i];
      seg.released = false;
      seg.decoding = true;
      renderList();
      setStatus('重新解码「' + seg.name + '」…');
      await decodeSegment(seg);
    }
    renderList();
  }

  /** 合并内存估算（字节）：输入解码数据 + 输出文件 */
  function estimateMergeBytes() {
    var inputs = 0, dur = 0;
    state.segments.forEach(function (s) {
      dur += s.duration || 0;
      if (s.pcm) {
        inputs += s.pcm.channels[0].length * s.pcm.channels.length * 4;
      } else {
        inputs += (s.duration || 0) * (s.sampleRate || 44100) * (s.channels || 1) * 4;
      }
    });
    var out = 0;
    if (state.format === 'wav') out = dur * estimateTargetRate() * 2 * 2;
    else if (state.format === 'mp3') out = dur * state.bitrate * 1000 / 8;
    else out = dur * 128000 / 8; // M4A 按 128kbps 估
    return { inputs: inputs, out: out, total: inputs + out };
  }

  /**
   * 流式合并（WAV/MP3）：逐段分块转换并写出。
   * @param {number} token 取消令牌
   * @param {Object|null} sink openMergeSink 的返回值（null = 内存拼接回落）
   */
  async function streamMerge(token, sink) {
    var segs = state.segments;
    var gapSec = parseFloat($('gapRange').value) || 0;
    var targetRate = AudioCore.pickTargetRate(segs.map(function (s) { return s.pcm.sampleRate; }));
    var plan = AudioCore.planMerge(
      segs.map(function (s) { return { name: s.name, pcm: s.pcm }; }),
      { targetSampleRate: targetRate, targetChannels: 2, gapSec: gapSec, fadeMs: 8 }
    );

    // 归一化全局增益（与"先拼接再归一化"等价：拼接后峰值 = 各段淡变后峰值的最大者）
    var gain = 1;
    if ($('normalizeChk').checked) {
      var peak = 0;
      plan.parts.forEach(function (p) {
        peak = Math.max(peak, AudioCore.segmentPeakAfterFade(
          segs[p.index].pcm, plan.targetSampleRate, plan.targetChannels, 8
        ));
      });
      if (peak > 0 && isFinite(peak)) gain = Math.min(0.89 / peak, 8);
    }

    var parts = []; // 回落模式的内存块
    function write(bytes) {
      if (sink) return sink.write(bytes);
      parts.push(bytes);
      // 每 32 块折叠成一个子 Blob：让浏览器把数据挪出 JS 堆（iOS 内存更友好），
      // 否则长 WAV 会在 JS 堆里堆到最后一次性成 Blob
      if (parts.length >= 32) parts = [new Blob(parts)];
      return Promise.resolve();
    }

    try {
      // WAV：头部先行（总帧数已由 planMerge 算出，无需回头补写）
      if (state.format === 'wav') {
        await write(AudioCore.buildWavHeader(
          plan.totalFrames, plan.targetSampleRate, plan.targetChannels, 16
        ));
      }
      var enc = null;
      if (state.format === 'mp3') {
        enc = new window.lamejs.Mp3Encoder(plan.targetChannels, plan.targetSampleRate, state.bitrate);
      }

      // 复用缓冲：Int16 每声道一块；WAV 还需一块交织字节缓冲
      var int16Chs = [];
      for (var c = 0; c < plan.targetChannels; c++) int16Chs.push(new Int16Array(MERGE_CHUNK_FRAMES));
      var wavBytes = null, wavView = null;
      if (state.format === 'wav') {
        wavBytes = new Uint8Array(MERGE_CHUNK_FRAMES * plan.targetChannels * 2);
        wavView = new DataView(wavBytes.buffer);
      }

      function writeWindow(frames) {
        if (state.format === 'wav') {
          var off = 0;
          for (var n = 0; n < frames; n++) {
            for (var ch = 0; ch < plan.targetChannels; ch++) {
              wavView.setInt16(off, int16Chs[ch][n], true);
              off += 2;
            }
          }
          return write(wavBytes.subarray(0, frames * plan.targetChannels * 2));
        }
        var left = int16Chs[0].subarray(0, frames);
        var right = plan.targetChannels > 1 ? int16Chs[1].subarray(0, frames) : null;
        var buf = right ? enc.encodeBuffer(left, right) : enc.encodeBuffer(left);
        if (buf && buf.length > 0) {
          return write(new Uint8Array(buf.buffer, buf.byteOffset, buf.length));
        }
        return Promise.resolve();
      }

      function writeSilence(frames) {
        var done = 0;
        function step() {
          if (done >= frames) return Promise.resolve();
          var n = Math.min(MERGE_CHUNK_FRAMES, frames - done);
          if (state.format === 'wav') {
            var p = write(new Uint8Array(n * plan.targetChannels * 2));
            done += n;
            return p.then(step);
          }
          for (var c = 0; c < plan.targetChannels; c++) int16Chs[c].fill(0, 0, n);
          var q = writeWindow(n);
          done += n;
          return q.then(step);
        }
        return step();
      }

      var writtenFrames = 0;
      var yieldCount = 0;
      for (var pi = 0; pi < plan.parts.length; pi++) {
        var part = plan.parts[pi];
        var seg = segs[part.index];
        var conv = AudioCore.createSegmentConverter(seg.pcm, {
          targetRate: plan.targetSampleRate,
          targetChannels: plan.targetChannels,
          gain: gain,
          fadeMs: 8,
          int16: true
        });
        var done = 0;
        while (done < part.outFrames) {
          if (token !== state.mergeToken) throw canceledError();
          var end = Math.min(done + MERGE_CHUNK_FRAMES, part.outFrames);
          conv.convert(done, end, int16Chs);
          await writeWindow(end - done);
          writtenFrames += end - done;
          done = end;
          setProgress(writtenFrames / plan.totalFrames,
            state.format === 'mp3' ? 'MP3 编码中' : '写出中');
          // 每 8 块让出一次主线程（约 5 秒音频/次）：进度足够流畅，
          // 又不会为长文件积累出几十秒的纯等待
          if ((++yieldCount & 7) === 0) await nextFrame();
        }
        if (plan.gapFrames > 0 && pi < plan.parts.length - 1) {
          await writeSilence(plan.gapFrames);
          writtenFrames += plan.gapFrames;
        }
        // 该段已消费：释放解码数据（保留 blob；重试时 ensureAllDecoded 重建）
        releaseSegmentPcm(seg);
        setStatus('已处理 ' + (pi + 1) + '/' + plan.parts.length +
          ' 段（' + seg.name + '），输入内存已释放');
      }

      if (state.format === 'mp3') {
        var flushBuf = enc.flush();
        if (flushBuf && flushBuf.length > 0) {
          await write(new Uint8Array(flushBuf.buffer, flushBuf.byteOffset, flushBuf.length));
        }
      }
      setProgress(1);

      var blob;
      if (sink) {
        blob = await sink.finish();
        state.mergedOpfsName = sink.name;
      } else {
        blob = new Blob(parts, { type: state.format === 'mp3' ? 'audio/mpeg' : 'audio/wav' });
      }
      return {
        blob: blob,
        sampleRate: plan.targetSampleRate,
        durationSec: plan.totalFrames / plan.targetSampleRate
      };
    } catch (e) {
      if (sink) sink.abort();
      throw e;
    }
  }

  /**
   * M4A(AAC) 实时编码：把各段 AudioBuffer 顺序调度进 MediaRecorder，
   * 不生成合并后的整体 PCM（旧实现整体拷贝一遍，长音频内存翻倍）。
   * 归一化/淡变经 GainNode 自动化实现；采样率不一致时仅对该段做一次
   * 瞬时重采样拷贝（声道交由 WebAudio 上混规则处理）。
   */
  function encodeM4AScheduled(segs, targetRate, gapSec, gain, fadeSec, token, onProgress) {
    return new Promise(function (resolve, reject) {
      var ctx = state.audioCtx;
      var dest = ctx.createMediaStreamDestination();
      var mime = pickMimeType() || '';
      var rec;
      try {
        rec = new MediaRecorder(dest.stream, mime ? { mimeType: mime } : undefined);
      } catch (e) { reject(e); return; }
      state.m4aRecorder = rec;
      var chunks = [];
      rec.ondataavailable = function (e) {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };
      var sources = [];
      var t = ctx.currentTime + 0.2;
      var t0 = t;

      function segmentBuffer(seg) {
        // 采样率一致：直接用解码缓冲（零拷贝）；否则仅对本段重采样
        if (seg.audioBuffer && seg.audioBuffer.sampleRate === targetRate) return seg.audioBuffer;
        var src = seg.pcm;
        var conv = AudioCore.createSegmentConverter(src, {
          targetRate: targetRate,
          targetChannels: src.channels.length, // 声道不变，单声道由 WebAudio 上混
          fadeMs: 0,
          int16: false
        });
        var buf = ctx.createBuffer(src.channels.length, conv.outFrames, targetRate);
        var views = [];
        for (var c = 0; c < src.channels.length; c++) views.push(buf.getChannelData(c));
        conv.convert(0, conv.outFrames, views);
        return buf;
      }

      segs.forEach(function (seg) {
        if (!seg.pcm) return;
        var buf = segmentBuffer(seg);
        var dur = buf.duration;
        var src = ctx.createBufferSource();
        src.buffer = buf;
        var g = ctx.createGain();
        if (dur > fadeSec * 2) {
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(gain, t + fadeSec);
          g.gain.setValueAtTime(gain, t + dur - fadeSec);
          g.gain.linearRampToValueAtTime(0, t + dur);
        } else {
          g.gain.value = gain;
        }
        src.connect(g);
        g.connect(dest);
        src.start(t);
        src.stop(t + dur);
        sources.push(src);
        t += dur + gapSec;
      });
      var endTime = t;

      rec.start(1000);
      var timer = setInterval(function () {
        var p = Math.min(1, Math.max(0, (ctx.currentTime - t0) / Math.max(0.001, endTime - t0)));
        onProgress(p);
        if (p >= 1) {
          clearInterval(timer);
          if (rec.state !== 'inactive') rec.stop();
        }
      }, 250);

      rec.onstop = function () {
        clearInterval(timer);
        state.m4aRecorder = null;
        sources.forEach(function (s) { try { s.stop(); } catch (e) { /* 忽略 */ } });
        if (token !== state.mergeToken) {
          reject(canceledError());
          return;
        }
        var type = (chunks[0] && chunks[0].type) || mime || 'audio/mp4';
        resolve({
          blob: new Blob(chunks, { type: type }),
          ext: /webm|ogg/i.test(type) ? 'webm' : 'm4a',
          mime: type
        });
      };
    });
  }

  async function doMerge() {
    var segs = state.segments;
    if (!segs.length) {
      setStatus('请先导入或录制至少一段音频', true);
      return;
    }
    if (decodingCount() > 0 || segs.some(function (s) { return s.failed; })) {
      setStatus('请先等待所有片段解码完成（或移除失败的片段）', true);
      return;
    }
    if (state.format === 'mp3' && !(window.lamejs && window.lamejs.Mp3Encoder)) {
      setStatus('MP3 编码器未加载，请刷新页面重试', true);
      return;
    }
    if (state.format === 'm4a' && !state.m4aSupported) {
      setStatus('当前浏览器不支持 M4A 输出，请选择 WAV 或 MP3', true);
      return;
    }

    var token = ++state.mergeToken;
    hideResult(); // 旧结果与新合并无关，先清掉（同时释放其 blob URL）
    setBusy(true);
    setStatus('正在准备合并…');
    showProgress(0);

    try {
      // 被释放过的片段重新解码（流式合并会逐段释放输入控制内存峰值）
      if (segs.some(function (s) { return s.released; })) {
        await ensureAllDecoded();
        if (token !== state.mergeToken) throw canceledError();
        if (decodingCount() > 0 || segs.some(function (s) { return s.failed; })) {
          throw new Error('请先等待所有片段解码完成（或移除失败的片段）');
        }
      }

      if (state.format === 'm4a') {
        // M4A：AudioBuffer 顺序调度 + MediaRecorder 实时捕获
        setStatus('M4A 实时编码中：耗时与音频等长，请保持页面在前台…');
        await getCtx();
        await nextFrame();
        var mTarget = AudioCore.pickTargetRate(segs.map(function (s) { return s.pcm.sampleRate; }));
        var mGap = parseFloat($('gapRange').value) || 0;
        var mGain = 1;
        if ($('normalizeChk').checked) {
          var mPeak = 0;
          segs.forEach(function (s) {
            mPeak = Math.max(mPeak, AudioCore.segmentPeakAfterFade(s.pcm, mTarget, 2, 8));
          });
          if (mPeak > 0 && isFinite(mPeak)) mGain = Math.min(0.89 / mPeak, 8);
        }
        var r = await encodeM4AScheduled(segs, mTarget, mGap, mGain, 0.008, token, function (p) {
          setProgress(p, 'M4A 实时编码中');
        });
        if (token !== state.mergeToken) throw canceledError();
        var mDur = segs.reduce(function (a, s) { return a + (s.duration || 0); }, 0) +
          mGap * (segs.length - 1);
        finishResult(r.blob, r.ext, r.mime, {
          sampleRate: mTarget, durationSec: mDur, bitrate: 0
        });
        return;
      }

      // WAV/MP3：流式合并（分块转换 + 落盘/内存回落 + 逐段释放输入）
      var sink = await openMergeSink(state.format);
      if (sink) await cleanOldOpfsFiles(sink.name);
      var est = estimateMergeBytes();
      // iOS 专项保护：输出文件过大时提前劝阻（重载发生在合并成功瞬间，事后无法挽回）
      if (isIOSDevice() && est.out > 200 * 1024 * 1024) {
        var iosOk = window.confirm(
          'iOS 浏览器内存有限：本次将生成约 ' + fmtSize(est.out) + ' 的 ' +
          state.format.toUpperCase() + ' 文件，\n继续可能触发页面重载（表现为"自动刷新"、结果丢失）。\n\n' +
          '建议改用 MP3（体积约为 1/10），或分段合并。\n\n仍要继续吗？'
        );
        if (!iosOk) {
          // 弹窗被拒：必须关闭已打开的 OPFS 写句柄，否则留下未关闭的 writable
          // 和孤儿文件（同名文件下次可能因句柄未释放而打不开，被迫退回内存模式）
          if (sink) await sink.abort();
          setStatus('已取消合并（iOS 内存保护）');
          return;
        }
      }
      if (!sink && est.total > 1200 * 1024 * 1024) {
        // 无流式落盘且估算内存危险：明确警告，让用户选择，而不是 silent crash
        var proceed = window.confirm(
          '本次合并预计需要约 ' + fmtSize(est.total) + ' 内存，且当前浏览器不支持流式落盘（OPFS）。' +
          '继续可能因内存不足导致页面重载。\n\n建议：分段合并、改用 MP3 输出，或换用支持 OPFS 的浏览器（Chrome/Edge）。\n\n仍要继续吗？'
        );
        if (!proceed) {
          if (sink) await sink.abort(); // 同上：关闭写句柄，避免孤儿文件与句柄滞留
          setStatus('已取消合并（内存估算超限）');
          return;
        }
        if (token !== state.mergeToken) throw canceledError();
      } else if (sink && est.inputs > 2000 * 1024 * 1024) {
        setStatus('输入音频很大（约 ' + fmtSize(est.inputs) +
          '），结果将直接写入本地存储，内存压力已尽量降低…');
      }
      var result = await streamMerge(token, sink);
      if (token !== state.mergeToken) throw canceledError();
      finishResult(result.blob, state.format,
        state.format === 'mp3' ? 'audio/mpeg' : 'audio/wav', {
          sampleRate: result.sampleRate,
          durationSec: result.durationSec,
          bitrate: state.format === 'mp3' ? state.bitrate : 0
        });
    } catch (err) {
      if (err && err.code === 'CANCELED') {
        setStatus('已取消合并');
      } else {
        console.error(err);
        setStatus('合并失败：' + (err && err.message ? err.message : err), true);
      }
    } finally {
      hideProgress();
      setBusy(false);
    }
  }

  /** 是否 iOS / iPadOS（含桌面模式） */
  function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  /**
   * 结果的 object URL 按需创建（V0.3.4）。
   * iOS 上在"合并成功"瞬间创建大 Blob 的 URL 并让 audio 加载，会叠加内存峰值，
   * 触发 WKWebView 内存上限 → 页面被系统重载（表现为"自动刷新"、分享按钮不出现）。
   */
  function ensureResultUrl() {
    if (!state.mergedBlob) return null;
    if (!state.mergedUrl) state.mergedUrl = URL.createObjectURL(state.mergedBlob);
    return state.mergedUrl;
  }

  function playResult() {
    var player = $('resultAudio');
    var url = ensureResultUrl();
    if (!url) return;
    if (player.getAttribute('src') !== url) player.src = url;
    player.hidden = false;
    var p = player.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        setStatus('播放失败：' + (err && err.message ? err.message : err), true);
      });
    }
  }

  function finishResult(blob, ext, mime, meta) {
    if (state.mergedUrl) URL.revokeObjectURL(state.mergedUrl);
    state.mergedBlob = blob;
    state.mergedUrl = null; // 延迟创建：只在用户点「试听」/「分享」时生成
    state.mergedExt = ext;
    var player = $('resultAudio');
    try { player.pause(); } catch (e) { /* 忽略 */ }
    player.removeAttribute('src');
    player.hidden = true;
    $('resultMeta').textContent = ext.toUpperCase() +
      (meta.bitrate ? ' · ' + meta.bitrate + ' kbps' : '') +
      ' · ' + Math.round(meta.sampleRate / 1000) + 'kHz' +
      ' · 时长 ' + fmtTime(meta.durationSec) +
      ' · 大小 ' + fmtSize(blob.size);
    $('resultBox').hidden = false;
    var big = blob.size > 60 * 1024 * 1024;
    setStatus('合并完成，可试听、分享或下载' +
      (big ? '（文件较大，点「试听」时才加载，避免 iOS 因内存不足重载页面）' : ''));
  }

  async function shareOrDownload() {
    var url = ensureResultUrl();
    if (!url) return;
    var ext = state.mergedExt || 'wav';
    var mime = (state.mergedBlob && state.mergedBlob.type) || 'audio/wav';
    var filename = 'merged-' + nowStamp() + '.' + ext;
    var size = state.mergedBlob ? state.mergedBlob.size : 0;
    var isIOS = isIOSDevice();

    // iOS + 大文件：系统分享要把整包读进内存（fetch → File），容易触发重载；
    // 直接交给系统播放器（流式读取），由用户在播放器里分享/存储
    if (isIOS && size > 80 * 1024 * 1024) {
      window.open(url, '_blank');
      setStatus('文件较大，已交给系统播放器打开（可用播放器的分享 / 存储功能）');
      return;
    }

    // 优先走系统分享（Android Chrome / iOS 15+ Safari 支持分享文件）
    try {
      /* 直接用已有的 mergedBlob 构造 File，不再 fetch(blobURL) → resp.blob()：
       * 那条路会把整个结果在内存里再物化一份（大文件下白吃一份内存，正是
       * V0.3.4 在 iOS 上修过的那类问题）。注意 OPFS 落盘的 File 没有 MIME
       * type（getFile() 返回 type 为空），必须包一层补上，否则部分系统的
       * canShare/share 会拒绝；内存回落与 M4A 路径的 Blob 自带 type。 */
      var src = state.mergedBlob;
      var file = (src instanceof File && src.type)
        ? src
        : new File([src], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '合并录音' });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // 用户取消分享
      // 分享不可用则继续走下载/打开
    }

    // iOS Safari 对 blob URL 的 download 属性支持不可靠，改为新窗口打开，
    // 由系统播放器接管（用户可用其分享/存储功能）
    if (isIOS) {
      window.open(url, '_blank');
      setStatus('已在新窗口打开，可通过系统播放器分享或存储');
      return;
    }

    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus('已触发下载：' + filename);
  }

  /* ---------------- 事件绑定 ---------------- */
  /** 文件选择回调（主入口与兼容模式入口共用） */
  function handleFilePick(e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = ''; // 允许重复选择同一文件
    enqueueFiles(files);
  }

  function bind() {
    // 导入按钮是 <label for="fileInput">：点击由浏览器原生激活 file input，
    // 不需要（也不能）用 JS 调 fileInput.click()——iOS WKWebView 会静默忽略
    // 对视觉隐藏 input 的程序化点击。这里只做管线预热。
    $('btnImport').addEventListener('click', function () {
      warmAudioPipeline(); // 文件选择器打开前预热（移动端选择器要数秒）
    });

    $('fileInput').addEventListener('change', handleFilePick);
    // 兼容模式入口：部分国产内核（X5/夸克/UC/厂商自带）对 accept 过滤有 bug，
    // 无 accept 的 input 仍能正常弹选择器；选中后同样走解码与格式校验
    $('fileInputAny').addEventListener('change', handleFilePick);

    $('btnRecord').addEventListener('click', toggleRecord);
    $('btnShare').addEventListener('click', shareOrDownload);
    $('btnPlayResult').addEventListener('click', playResult);
    $('btnCancel').addEventListener('click', cancelMerge);

    $('btnMerge').addEventListener('click', function () {
      if (state.busy) {
        cancelMerge();
        return;
      }
      doMerge();
    });

    $('btnClear').addEventListener('click', function () {
      if (state.busy) { // 合并中清空列表同样不影响进行中的合并，只会造成困惑
        setStatus('合并进行中：请先取消合并，再清空片段列表', true);
        return;
      }
      stopSegPlayback();
      decodeQueue = [];
      state.segments.forEach(function (s) {
        if (s.url) URL.revokeObjectURL(s.url);
      });
      state.segments = [];
      hideResult();
      renderList();
      setStatus('已清空片段列表');
    });

    $('segmentList').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      var li = btn.closest('.seg');
      if (!li) return;
      var id = li.dataset.id;
      var act = btn.dataset.act;
      if (act === 'play') toggleSegPlayback(id);
      else if (act === 'up') moveSegment(id, -1);
      else if (act === 'down') moveSegment(id, 1);
      else if (act === 'del') removeSegment(id);
    });

    $('formatGroup').addEventListener('click', function (e) {
      var btn = e.target.closest('.seg-btn');
      if (btn && !btn.disabled) setFormat(btn.dataset.fmt);
    });

    $('bitrateSel').addEventListener('change', function () {
      state.bitrate = parseInt(this.value, 10) || 128;
      updateSizeEstimate();
    });

    $('segPlayer').addEventListener('ended', function () {
      if (state.playingId) {
        stopSegPlayback();
        renderList(true);
      }
    });

    $('gapRange').addEventListener('input', function () {
      $('gapValue').textContent = parseFloat(this.value).toFixed(1) + ' 秒';
    });
  }

  /* ---------------- 启动 ---------------- */
  document.addEventListener('DOMContentLoaded', function () {
    try {
      bind();
      detectFormats();
      setFormat('wav');
      renderList();
      setStatus('就绪：导入 mp3 / m4a / wav 等音频，或直接录音，然后点击底部「合并」');

      // 页脚版本号：取核心层的单一权威值（作者与链接在模板中静态声明）
      $('appVersion').textContent = 'v' + AudioCore.APP_VERSION;

      // 通知启动守卫：应用已就绪（守卫会撤掉可能已显示的失败提示）
      if (typeof window.__AML_BOOTED === 'function') window.__AML_BOOTED();

      // PWA 离线缓存：仅在真实 http(s) 部署时注册（跳过 localhost 与 Capacitor 壳，
      // 避免 Capacitor 本地资源服务器被缓存导致更新后拿到旧文件）
      var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !isLocal) {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* 注册失败不影响使用 */
        });
      }
    } catch (err) {
      // 初始化异常：交给启动守卫显示可读提示（否则用户只看到白屏）
      if (typeof window.__AML_FAIL === 'function') {
        window.__AML_FAIL('初始化异常：' + (err && err.message ? err.message : err));
      }
      throw err;
    }
  });
})();

</script>
</body>
</html>
